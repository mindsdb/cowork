# Detect startup_failure runs with zero jobs: an in-pipeline notification cannot execute there.
# Alerts may repeat during the polling window. Scheduled execution starts only on the default branch;
# use workflow_dispatch to test another ref or replay an incident.

name: Pipeline watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      lookback-minutes:
        description: "Widen to replay a past incident"
        type: number
        default: 90

jobs:
  startup-failures:
    permissions:
      contents: read
      actions: read # run + job history for the sweep
    uses: mindsdb/github-actions/.github/workflows/notify-startup-failure.yml@main
    with:
      branches: "main staging"
      lookback-minutes: ${{ inputs.lookback-minutes && fromJson(inputs.lookback-minutes) || 90 }}
      runs-on: ubuntu-latest
    secrets: inherit
