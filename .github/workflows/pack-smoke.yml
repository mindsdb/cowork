name: Pack smoke

#  run the real electron-builder
# --dir pack on macOS and assert the packaged output contains the main entry,
# the renderer bundle, and extraResources. Catches "packaging silently
# dropped a file" — invisible to typecheck/unit tests/vite build.

on:
  schedule:
    - cron: '0 6 * * *' # nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry
        with:
          command: npm ci

      # extraResources requires this file; release builds generate it from
      # OAuth secrets (build-macos-pkg.yml). The smoke verifies packaging
      # structure, not OAuth — an empty-valued file of the same shape is
      # exactly what the release script produces with no secrets set.
      - name: Write placeholder server-credentials.json
        run: |
          python3 -c "
          import json
          keys = [
            'GOOGLE_DRIVE_CLIENT_ID', 'GOOGLE_DRIVE_CLIENT_SECRET',
            'GOOGLE_CALENDAR_CLIENT_ID', 'GOOGLE_CALENDAR_CLIENT_SECRET',
            'GMAIL_CLIENT_ID', 'GMAIL_CLIENT_SECRET',
            'GOOGLE_ADS_CLIENT_ID', 'GOOGLE_ADS_CLIENT_SECRET',
            'GOOGLE_ANALYTICS_CLIENT_ID', 'GOOGLE_ANALYTICS_CLIENT_SECRET',
          ]
          with open('server-credentials.json', 'w') as f:
              json.dump({k: '' for k in keys}, f)
          "

      # Unsigned build: no certs in this workflow — codesign warnings are
      # expected (CLAUDE.md), notarize.js self-skips without APPLE_* env.
      - name: Pack (electron-builder --dir)
        run: npm run pack

      - name: Verify packaged output
        run: node scripts/verify-pack.mjs
