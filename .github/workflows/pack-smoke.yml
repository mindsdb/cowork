name: Pack smoke

# Verify real electron-builder output: missing packaged resources are invisible to typecheck and unit tests.

on:
  schedule:
    - cron: '0 6 * * *' # nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry
        with:
          command: npm ci

      # macOS credentials are staged by pkg postinstall, which this directory-only smoke build does not run.

      # Unsigned smoke build: signing warnings are expected; notarization skips without APPLE_* credentials.
      - name: Pack (electron-builder --dir)
        run: npm run pack

      - name: Verify packaged output
        run: node scripts/verify-pack.mjs
