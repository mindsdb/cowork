name: Pack smoke

#  run the real electron-builder
# --dir pack on macOS and assert the packaged output contains the main entry,
# the renderer bundle, and extraResources. Catches "packaging silently
# dropped a file" — invisible to typecheck/unit tests/vite build.

on:
  schedule:
    - cron: '0 6 * * *' # nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry
        with:
          command: npm ci

      # ENG-1241: macOS no longer embeds server-credentials.json via
      # extraResources at all (it's Windows-only now, staged instead by a
      # pkgbuild postinstall script that this --dir smoke build never runs),
      # so there's nothing to place before packing on this platform.

      # Unsigned build: no certs in this workflow — codesign warnings are
      # expected (CLAUDE.md), notarize.js self-skips without APPLE_* env.
      - name: Pack (electron-builder --dir)
        run: npm run pack

      - name: Verify packaged output
        run: node scripts/verify-pack.mjs
