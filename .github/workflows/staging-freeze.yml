name: Staging Freeze
on:
  schedule:
    # Friday 13:47 UTC avoids the high-load top-of-hour schedule slot.
    - cron: '47 13 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    # The reusable owns both failure and recovery notifications.
    permissions:
      contents: read
      # actions: read enables recovery lookup; the reusable must inherit this grant without capping it.
      actions: read
    uses: mindsdb/github-actions/.github/workflows/release-freeze.yml@main
    secrets: inherit
