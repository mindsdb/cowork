name: Publish UI Bundle

# Three jobs, so the page-update signing key never shares a runner with
# `npm ci` or any third-party package code:
#
#   build    installs dependencies and builds dist/renderer. No signing key,
#            no RELEASES_TOKEN.
#   sign     runs only scripts/sign-ui-bundle.mjs from this commit, with
#            UI_SIGNING_KEY from the `ui-signing` environment. No npm ci, no
#            dependency cache.
#   publish  uploads the signed tarball and writes latest.json with
#            RELEASES_TOKEN. It never rebuilds or re-packs the bundle.

on:
  # Primary path: the auto-release workflow calls this AFTER it creates the
  # canonical CalVer tag, passing the exact release version — so the UI bundle
  # and the prod app installer always publish the SAME version. This replaces
  # the old `push: main` + git-describe path, which raced tag creation and
  # could publish a version that differed from the released app.
  workflow_call:
    inputs:
      version:
        description: 'Exact version to publish (from the auto-release job, e.g. 2.26.7.6.1).'
        required: true
        type: string
      shell_version:
        description: 'Installer (shell) CalVer shipping alongside this UI bundle. Emitted into latest.json as shellVersion so clients can offer a reinstall notice. ONLY set on the auto-release path, where a prod installer is actually published — a UI-only re-publish must leave it empty so no phantom reinstall notice appears.'
        required: false
        type: string
    secrets:
      RELEASES_TOKEN:
        required: true
      # Baked into the OTA bundle at build time (see "Build renderer"). Required
      # so a caller fails before a release starts; dispatch/tag triggers skip
      # workflow_call secret validation, so the build step rejects empty too.
      VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN:
        required: true
      # The value lives only in the `ui-signing` environment, which the sign
      # job names; the environment's value wins over anything a caller holds.
      # A caller still has to pass the name, with `secrets: inherit` or
      # `UI_SIGNING_KEY: ${{ secrets.UI_SIGNING_KEY }}`, or the key reaches the
      # sign job empty and the signer refuses to run. It is optional because the
      # signer already refuses an empty key, while a failed `required` check
      # would reject the whole calling run at startup.
      UI_SIGNING_KEY:
        required: false
  # Manual re-publish / backfill. Leave version empty to derive from git describe.
  workflow_dispatch:
    inputs:
      version:
        description: 'UI version override (e.g. 2.26.7.6.1) — leave empty to derive the CalVer from git describe'
        required: false
        type: string
      min_server_version:
        description: 'Minimum cowork-server CalVer this UI requires (e.g. 2.26.7.6.1) — leave empty for no constraint / to use package.json minServerVersion'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      min_server_version: ${{ steps.min-server-version.outputs.min_server_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the fallback `git describe` (manual dispatch with no
          # version) can reach the nearest CalVer tag. The normal path receives
          # the exact release version from the auto-release job, so no describe.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Resolve the version BEFORE building so it can be baked into the renderer
      # bundle's __APP_VERSION__ — otherwise Vite falls back to its own git
      # describe and a workflow_dispatch override (or the release version) never
      # reaches the running bundle, only latest.json.
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # workflow_call (auto-release) or workflow_dispatch override — the
            # canonical release version, identical to the prod app installer.
            VER="$INPUT_VERSION"
          else
            # Edge (manual dispatch with no version): derive the CalVer from git
            # describe, falling back to package.json + short sha.
            VER=$(git describe --tags --match "v[0-9]*" 2>/dev/null | sed 's/^v//')
            if [ -z "$VER" ]; then
              VER="$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)"
            fi
          fi
          VER="${VER#v}"

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=ui-v$VER" >> "$GITHUB_OUTPUT"
          echo "Publishing UI version: $VER"

      # Optional min cowork-server CalVer this UI requires: explicit dispatch
      # input, else package.json `minServerVersion`, else none. Absence means
      # "no constraint": latest.json omits min_server_version and both signed
      # payloads carry null.
      - name: Determine min server version
        id: min-server-version
        env:
          MIN_SERVER_VERSION_INPUT: ${{ github.event.inputs.min_server_version }}
        run: |
          if [ -n "$MIN_SERVER_VERSION_INPUT" ]; then
            MIN_SERVER_VERSION="$MIN_SERVER_VERSION_INPUT"
          else
            MIN_SERVER_VERSION="$(node -p "require('./package.json').minServerVersion || ''" 2>/dev/null || echo '')"
          fi
          echo "min_server_version=$MIN_SERVER_VERSION" >> "$GITHUB_OUTPUT"
          echo "Min server version: ${MIN_SERVER_VERSION:-'(none)'}"

      - name: Build renderer
        # Bake the resolved version into __APP_VERSION__ (matches latest.json and
        # the prod installer). The PostHog token MUST be injected here: the OTA
        # bundle overwrites the installer's renderer, so a missing token ships an
        # empty key and silently disables analytics. Do not remove.
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN: ${{ secrets.VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN }}
          # Explicit prod target (defense-in-depth). This workflow only publishes
          # the prod bundle and the renderer already falls back to api.mindshub.ai
          # (mindsUrls.ts); pinning it fails loudly if reused for a non-prod
          # channel. Keycloak/console derive from this base.
          VITE_MINDS_API_URL: https://api.mindshub.ai
        run: |
          if [ -z "${VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN}" ]; then
            echo "::error::VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN is empty; refusing to publish an analytics-disabled OTA bundle."
            exit 1
          fi
          npm run build:renderer

      - name: Upload renderer build
        uses: actions/upload-artifact@v4
        with:
          name: ui-renderer
          path: dist/renderer
          # The artifact must carry exactly what the build wrote, dotfiles too.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-latest
    # The environment holds UI_SIGNING_KEY, and its deployment policy admits
    # only `main`. Nothing in this job installs or runs package code: the
    # runner's own Node runs the one script from this commit, and the three
    # actions it uses are pinned to commit SHAs.
    environment: ui-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/sign-ui-bundle.mjs
            src/main/ui-release-public-key.ts
          sparse-checkout-cone-mode: false

      - name: Download renderer build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-renderer
          path: renderer

      # The signer refuses to run when the key's public half differs from the
      # release key in src/main/ui-release-public-key.ts, so a release can't
      # publish a bundle every client would refuse.
      - name: Sign renderer bundle
        env:
          UI_SIGNING_KEY: ${{ secrets.UI_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
          MIN_SERVER_VERSION: ${{ needs.build.outputs.min_server_version }}
        run: |
          node scripts/sign-ui-bundle.mjs \
            --dir renderer \
            "--version=$VERSION" \
            "--min-server-version=$MIN_SERVER_VERSION" \
            --out signed \
            --check-public-key src/main/ui-release-public-key.ts

      - name: Upload signed bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-signed
          path: |
            signed/ui-bundle.tar.gz
            signed/ui-bundle.sha256
            signed/ui-signature.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    # RELEASES_TOKEN does the writing; this repository's token only reads.
    permissions:
      contents: read
    steps:
      - name: Check if version already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo mindsdb/antontron-releases &>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $TAG already published — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download signed bundle
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-signed
          path: signed

      # The tarball, ui-bundle.sha256 and the signed payload must agree before
      # anything is published; a mismatch would ship a bundle every client
      # refuses.
      - name: Check signed bundle
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MIN_SERVER_VERSION: ${{ needs.build.outputs.min_server_version }}
        run: |
          python3 -c "
          import base64, hashlib, json, os, sys
          with open('signed/ui-bundle.tar.gz', 'rb') as f:
              actual = hashlib.sha256(f.read()).hexdigest()
          with open('signed/ui-bundle.sha256') as f:
              listed = f.read().strip()
          with open('signed/ui-signature.json') as f:
              payload = json.loads(base64.b64decode(json.load(f)['signed']))
          expected = {
              'kind': 'cowork-ui-latest',
              'schema': 1,
              'version': os.environ['VERSION'],
              'sha256': actual,
              'minServerVersion': os.environ.get('MIN_SERVER_VERSION', '').strip() or None,
          }
          if listed != actual or payload != expected:
              print('::error::The signed bundle does not match: tarball sha256 %s, ui-bundle.sha256 %s, signed payload %s' % (actual, listed, json.dumps(payload)))
              sys.exit(1)
          print('Signed bundle checked: %s' % actual)
          "

      - name: Publish to antontron-releases
        if: steps.check.outputs.skip != 'true'
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          MIN_SERVER_VERSION: ${{ needs.build.outputs.min_server_version }}
          SHELL_VERSION: ${{ inputs.shell_version }}
        run: |
          # -e: halt on first failure (so a bad token fails here, not
          # three commands later). pipefail: propagate failure of the
          # `echo | gh auth login` pipe. (-u omitted on purpose — the
          # gh-pages git steps below use `|| fallback` idioms that are
          # fine with unset edge cases.)
          set -eo pipefail
          SHA256="$(cat signed/ui-bundle.sha256)"
          export SHA256
          export DOWNLOAD_URL="https://github.com/mindsdb/antontron-releases/releases/download/${TAG}/ui-bundle.tar.gz"
          echo "Min server version: ${MIN_SERVER_VERSION:-'(none)'}"

          # Fail loudly if the token secret is missing/empty. Without
          # this the public-repo clone below still succeeds (no auth
          # needed to read a public repo), and the failure only shows
          # up later as a confusing 401 from `gh`.
          if [ -z "${RELEASES_TOKEN}" ]; then
            echo "::error::RELEASES_TOKEN secret is empty. Set a PAT (or app token) with contents:write on mindsdb/antontron-releases."
            exit 1
          fi

          # Authenticate gh explicitly with the token. `gh` prefers the
          # GH_TOKEN env var over a logged-in credential, so we must NOT
          # have GH_TOKEN set here (note it's been removed from this
          # step's env above) — otherwise `gh auth login` is a no-op and
          # gh keeps using the env value. `gh auth status` then surfaces
          # an invalid/expired token immediately rather than as a vague
          # 401 three commands later.
          unset GH_TOKEN || true
          echo "${RELEASES_TOKEN}" | gh auth login --with-token
          gh auth status

          # Clone the public releases repo
          git clone "https://x-access-token:${RELEASES_TOKEN}@github.com/mindsdb/antontron-releases.git" releases-repo

          # Create release with the signed bundle via gh CLI
          cd releases-repo
          gh release create "$TAG" \
            --title "UI $VERSION" \
            --notes "Renderer UI bundle v${VERSION}" \
            ../signed/ui-bundle.tar.gz \
            || { echo "Release may already exist, uploading asset..."; gh release upload "$TAG" ../signed/ui-bundle.tar.gz --clobber; }

          # Update latest.json on gh-pages
          git fetch origin gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Write manifest (from env, so min_server_version is only emitted when
          # set — the client treats its absence as "no constraint").
          python3 -c "
          import json, os
          data = {
              'version': os.environ['VERSION'],
              'url': os.environ['DOWNLOAD_URL'],
              'sha256': os.environ['SHA256'],
          }
          msv = os.environ.get('MIN_SERVER_VERSION', '').strip()
          if msv:
              data['min_server_version'] = msv
          # Shell (installer) version. A new installer only ships on
          # the auto-release path, which passes SHELL_VERSION. On a UI-only
          # publish it's empty — carry over the last-published shellVersion
          # rather than dropping it, or users on an older shell would stop
          # getting the reinstall notice after any UI-only publish. First real
          # installer sets it; nothing here ever clears a once-published value.
          sv = os.environ.get('SHELL_VERSION', '').strip()
          if not sv:
              try:
                  with open('latest.json') as prev:
                      sv = (json.load(prev).get('shellVersion') or '').strip()
              except (FileNotFoundError, ValueError):
                  sv = ''
          if sv:
              data['shellVersion'] = sv
          # The signed copy of version, sha256 and minServerVersion, which a
          # shell that verifies page updates reads instead of the fields above.
          with open('../signed/ui-signature.json') as f:
              signature = json.load(f)
          data['signed'] = signature['signed']
          data['signature'] = signature['signature']
          with open('latest.json', 'w') as f:
              json.dump(data, f, indent=2)
          print(json.dumps(data, indent=2))
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "UI ${VERSION}" || echo "No changes"
          git push origin gh-pages
