name: Document preview

# The document preview suite (playwright.document-preview.config.ts):
#   web       Chromium against the preview harness, one spec per document type.
#   electron  The desktop isolation spec against the built app, under xvfb.
#
# Both run with --pass-with-no-tests, so a job stays green while its specs
# have not landed yet and starts gating them the moment they do.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry
        with:
          command: npm ci
      # The CJK fixtures draw text with system fonts when the file embeds none.
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build web
        run: npm run build:web
      - name: Run the web project
        run: npx playwright test --config playwright.document-preview.config.ts --project web --pass-with-no-tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: document-preview-web-traces
          path: test-results/
          retention-days: 7

  electron:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry
        with:
          command: npm ci
      - name: Build main + renderer
        run: npm run build
      - name: Install Electron Linux runtime deps
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0
      - name: Run the electron project (headless via xvfb)
        run: xvfb-run --auto-servernum -- npx playwright test --config playwright.document-preview.config.ts --project electron --pass-with-no-tests
        env:
          # Surface the Electron main process stdout/stderr in the CI log; a
          # main-process crash otherwise reads as a bare firstWindow timeout.
          DEBUG: pw:browser*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: document-preview-electron-traces
          path: test-results/
          retention-days: 7
