name: Staging Unfreeze
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Share concurrency with sync-main-to-staging: a release merge fires both App-token staging pushes.
concurrency:
  group: sync-main-to-staging
  cancel-in-progress: false

jobs:
  unfreeze:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'staging' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      # actions: read enables recovery lookup; the reusable must inherit this grant without capping it.
      actions: read
    uses: mindsdb/github-actions/.github/workflows/release-unfreeze.yml@main
    secrets: inherit
