name: Staging - Build installer on staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  build-macos:
    uses: ./.github/workflows/build-macos-pkg.yml
    with:
      build_kind: stable
      # server_ref still matters for machines that already carry a GIT
      # install of cowork-server: the source-aware updater keeps them on
      # git@staging. Fresh installs use the pypi rc stream below.
      server_ref: staging
      # Channel is derived from build_kind in the build workflow (stable →
      # PyPI rc stream, no git), following cowork-server's publish-staging rc
      # track. Requires that track to be live and to have published an rc;
      # otherwise the floor resolves to the latest MAIN release.
      minds_api_url: https://api.staging.mindshub.ai
    secrets: inherit

  upload-macos:
    needs: build-macos
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: mac
      build_kind: stable
      artifact_name: ${{ needs.build-macos.outputs.artifact_name }}

  build-windows:
    uses: ./.github/workflows/build-windows-installer.yml
    with:
      build_kind: stable
      # server_ref still matters for machines that already carry a GIT
      # install of cowork-server: the source-aware updater keeps them on
      # git@staging. Fresh installs use the pypi rc stream below.
      server_ref: staging
      # Channel is derived from build_kind in the build workflow (stable →
      # PyPI rc stream, no git), following cowork-server's publish-staging rc
      # track. Requires that track to be live and to have published an rc;
      # otherwise the floor resolves to the latest MAIN release.
      minds_api_url: https://api.staging.mindshub.ai
    secrets: inherit

  upload-windows:
    needs: build-windows
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: windows
      build_kind: stable
      artifact_name: ${{ needs.build-windows.outputs.artifact_name }}

  notify:
    # Alert the eng channel if ANY job in the staging installer pipeline fails.
    # One job covers both outcomes: a `uses:` job cannot branch on status, so
    # the aggregate result picks the failed or recovered message, and a
    # cancelled run stays silent.
    needs: [build-macos, upload-macos, build-windows, upload-windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      actions: read  # the prior-run lookup behind the recovery message
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "staging installer build"
      status: ${{ contains(needs.*.result, 'failure') && 'failed' || 'recovered' }}
      runs-on: ubuntu-latest
    secrets: inherit
