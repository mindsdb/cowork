name: Staging - Build installer on staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  build-macos:
    uses: ./.github/workflows/build-macos-pkg.yml
    with:
      build_kind: stable
      # server_ref still matters for machines that already carry a GIT
      # install of cowork-server: the source-aware updater keeps them on
      # git@staging. Fresh installs use the pypi rc stream below.
      server_ref: staging
      # Staging installs from the PyPI pre-release (rc) track published by
      # cowork-server's publish-staging workflow — same no-git/no-Xcode
      # install flow as prod, following the staging version stream. Flip
      # this only after that workflow is live and has published an rc;
      # otherwise the floor resolves to the latest MAIN release.
      server_channel: pypi
      minds_api_url: https://api.staging.mindshub.ai
    secrets: inherit

  upload-macos:
    needs: build-macos
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: mac
      build_kind: stable
      artifact_name: ${{ needs.build-macos.outputs.artifact_name }}

  build-windows:
    uses: ./.github/workflows/build-windows-installer.yml
    with:
      build_kind: stable
      # server_ref still matters for machines that already carry a GIT
      # install of cowork-server: the source-aware updater keeps them on
      # git@staging. Fresh installs use the pypi rc stream below.
      server_ref: staging
      # Staging installs from the PyPI pre-release (rc) track published by
      # cowork-server's publish-staging workflow — same no-git/no-Xcode
      # install flow as prod, following the staging version stream. Flip
      # this only after that workflow is live and has published an rc;
      # otherwise the floor resolves to the latest MAIN release.
      server_channel: pypi
      minds_api_url: https://api.staging.mindshub.ai
    secrets: inherit

  upload-windows:
    needs: build-windows
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: windows
      build_kind: stable
      artifact_name: ${{ needs.build-windows.outputs.artifact_name }}

  notify-failure:
    # Alert the eng channel if ANY job in the staging installer pipeline fails.
    needs: [build-macos, upload-macos, build-windows, upload-windows]
    if: failure()
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "staging installer build"
      runs-on: ubuntu-latest
    secrets: inherit


  notify-recovery:
    # Post a green "recovered" message when the pipeline goes green after a
    # failing run (the reusable no-ops on a normal green run).
    needs: [build-macos, upload-macos, build-windows, upload-windows]
    if: success()
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "staging installer build"
      status: recovered
      runs-on: ubuntu-latest
    secrets: inherit
