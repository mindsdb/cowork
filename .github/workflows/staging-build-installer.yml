name: Staging - Build installer on staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  build-macos:
    uses: ./.github/workflows/build-macos-pkg.yml
    with:
      build_kind: stable
      server_ref: staging
      minds_api_url: https://api.staging.mindshub.ai
    secrets: inherit

  upload-macos:
    needs: build-macos
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: mac
      build_kind: stable
      artifact_name: ${{ needs.build-macos.outputs.artifact_name }}

  build-windows:
    uses: ./.github/workflows/build-windows-installer.yml
    with:
      build_kind: stable
      server_ref: staging
      minds_api_url: https://api.staging.mindshub.ai
    secrets: inherit

  upload-windows:
    needs: build-windows
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: windows
      build_kind: stable
      artifact_name: ${{ needs.build-windows.outputs.artifact_name }}

  build-linux:
    uses: ./.github/workflows/build-linux-deb.yml
    with:
      build_kind: stable
      server_ref: staging
      minds_api_url: https://api.staging.mindshub.ai
    secrets: inherit

  upload-linux-amd64:
    needs: build-linux
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: linux-amd64
      build_kind: stable
      artifact_name: ${{ needs.build-linux.outputs.artifact_name_amd64 }}

  upload-linux-arm64:
    needs: build-linux
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: linux-arm64
      build_kind: stable
      artifact_name: ${{ needs.build-linux.outputs.artifact_name_arm64 }}
