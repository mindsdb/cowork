# Build and deploy cowork SaaS to the kubernetes dev cluster.
# Finds all PR labels in the form "deploy-to-<env>" and deploys to those envs.

name: SaaS Dev - Build and Deploy on push

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # Looks for labels like "deploy-to-<env>" attached to a PR
  get-deploy-labels:
    runs-on: mdb-dev
    outputs:
      deploy-envs: ${{ steps.get-labels.outputs.deploy-envs }}
    steps:
      - name: Pull MindsDB Github Actions
        uses: actions/checkout@v4
        with:
          repository: mindsdb/github-actions
          path: github-actions
      - id: get-labels
        uses: ./github-actions/get-deploy-labels

  filter-deploy-envs:
    needs: [get-deploy-labels]
    runs-on: mdb-dev
    outputs:
      deploy-envs: ${{ steps.filter.outputs.deploy-envs }}
    steps:
      - name: Drop prod + staging from PR-label matrix
        id: filter
        env:
          RAW_ENVS: ${{ needs.get-deploy-labels.outputs.deploy-envs }}
        run: |
          set -euo pipefail
          FILTERED="$(printf '%s' "$RAW_ENVS" | jq -c '[ .[] | select(. != "prod" and . != "staging") ]')"
          echo "deploy-envs=${FILTERED}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: mdb-dev
    needs: [filter-deploy-envs]
    if: needs.filter-deploy-envs.outputs.deploy-envs != '[]'
    strategy:
      fail-fast: false
      matrix:
        deploy-env: ${{ fromJson(needs.filter-deploy-envs.outputs.deploy-envs) }}
    outputs:
      image: ${{ steps.build.outputs.image }}
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Pull MindsDB Github Actions
        uses: actions/checkout@v4
        with:
          repository: mindsdb/github-actions
          path: github-actions
      - uses: ./github-actions/setup-env
      - id: build
        uses: ./github-actions/build-push-ecr
        with:
          module-name: cowork
          build-for-environment: ${{ matrix.deploy-env }}
          extra-build-args: '-f cowork/Dockerfile --build-arg APP_ENV=${{ matrix.deploy-env }}'

  deploy:
    runs-on: mdb-dev
    needs: [build, filter-deploy-envs]
    if: needs.filter-deploy-envs.outputs.deploy-envs != '[]'
    strategy:
      fail-fast: false
      matrix:
        deploy-env: ${{fromJson(needs.filter-deploy-envs.outputs.deploy-envs)}}
    environment:
      name: ${{ matrix.deploy-env }}
      url: ${{ vars.MDB_ENV_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull MindsDB Github Actions
        uses: actions/checkout@v4
        with:
          repository: mindsdb/github-actions
          path: github-actions
      - uses: ./github-actions/setup-env
      - name: Notify of deployment starting
        id: slack
        uses: ./github-actions/slack-deploy-msg
        with:
          channel-id: ${{ secrets.SLACK_DEPLOYMENTS_CHANNEL_ID }}
          status: 'started'
          color: '#0099CC'
          env-name: ${{ matrix.deploy-env }}
          env-url: ${{ vars.MDB_ENV_URL }}
          slack-token: ${{ secrets.GH_ACTIONS_SLACK_BOT_TOKEN }}
      - uses: DevOps-Nirvana/aws-helm-multi-deploy-nodocker@v8
        with:
          environment-slug: ${{matrix.deploy-env}}
          k8s-namespace: ${{matrix.deploy-env}}
          image-tag: ${{ matrix.deploy-env }}-${{ env.SLUG }}
          timeout: 600s
      - name: Notify of deployment finish
        uses: ./github-actions/slack-deploy-msg
        if: always()
        with:
          channel-id: ${{ secrets.SLACK_DEPLOYMENTS_CHANNEL_ID }}
          status: "${{ job.status == 'success' && 'finished' || 'failed' }}"
          color: "${{ job.status == 'success' && '#00C851' || '#FF4444' }}"
          env-name: ${{ matrix.deploy-env }}
          env-url: ${{ vars.MDB_ENV_URL }}
          slack-token: ${{ secrets.GH_ACTIONS_SLACK_BOT_TOKEN }}
          update-message-id: ${{ steps.slack.outputs.ts }}
