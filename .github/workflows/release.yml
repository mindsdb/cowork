name: Auto Release - CalVer tag and GitHub Release

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-release:
    uses: mindsdb/github-actions/.github/workflows/calver-release.yml@main
    with:
      calver-major: "2"
      runs-on: ubuntu-latest

  build-deploy-prod:
    needs: auto-release
    uses: ./.github/workflows/prod-build-installer.yml
    with:
      tag: ${{ needs.auto-release.outputs.tag }}
    secrets: inherit

  # Publish the UI bundle from the SAME release version as the prod installer
  # above, so OTA users never see a UI version that differs from the app.
  #
  # Depends on build-deploy-prod (not just auto-release) so the manifest is
  # written only AFTER the installer uploads succeed. It records that installer
  # as the latest shell version (ENG-849), so publishing it before the installer
  # exists — or after that build failed — would advertise a reinstall the
  # download URL can't serve.
  publish-ui:
    needs: [auto-release, build-deploy-prod]
    uses: ./.github/workflows/publish-ui.yml
    with:
      version: ${{ needs.auto-release.outputs.version }}
      # The prod installer that build-deploy-prod just shipped, at the same
      # CalVer as the installer and the UI bundle (ENG-849).
      shell_version: ${{ needs.auto-release.outputs.version }}
    secrets: inherit

  notify:
    # Alert the eng channel if ANY job in the release pipeline fails (tag,
    # installer build, or UI publish).
    # One job covers both outcomes: a `uses:` job cannot branch on status, so
    # the aggregate result picks the failed or recovered message, and a
    # cancelled run stays silent.
    needs: [auto-release, build-deploy-prod, publish-ui]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      actions: read  # the prior-run lookup behind the recovery message
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "release"
      status: ${{ contains(needs.*.result, 'failure') && 'failed' || 'recovered' }}
      runs-on: ubuntu-latest
    secrets: inherit
