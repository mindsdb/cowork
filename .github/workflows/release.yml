name: Auto Release - CalVer tag and GitHub Release

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CALVER_MAJOR: 2

jobs:
  auto-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags for sequence calculation

      - name: Compute CalVer version
        id: version
        run: |
          set -euo pipefail

          MAJOR=${{ env.CALVER_MAJOR }}
          YY=$(date -u +%y)    # e.g. 26
          M=$(date -u +%-m)    # e.g. 6 (no zero-pad)
          DD=$(date -u +%-d)   # e.g. 23 (no zero-pad)

          # Find the highest sequence for today's date
          PREFIX="v${MAJOR}.${YY}.${M}.${DD}."
          SEQ=0
          for tag in $(git tag -l "${PREFIX}*" | sort -t. -k5 -n); do
            N="${tag##*.}"
            if [[ "$N" =~ ^[0-9]+$ ]] && [ "$N" -gt "$SEQ" ]; then
              SEQ="$N"
            fi
          done
          SEQ=$((SEQ + 1))

          VERSION="${MAJOR}.${YY}.${M}.${DD}.${SEQ}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          gh release create "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --title "${{ steps.version.outputs.tag }}"

  build-deploy-prod:
    needs: auto-release
    uses: ./.github/workflows/prod-build-installer.yml
    with:
      tag: ${{ needs.auto-release.outputs.tag }}
    secrets: inherit

  # Publish the UI bundle from the SAME release version as the prod installer
  # above, so OTA users never see a UI version that differs from the app.
  publish-ui:
    needs: auto-release
    uses: ./.github/workflows/publish-ui.yml
    with:
      version: ${{ needs.auto-release.outputs.version }}
    secrets: inherit
