name: Staging - Build and Deploy on push to staging


on:
  push:
    branches:
      - staging

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  run-unit-tests:
    uses: ./.github/workflows/tests-unit.yml
    secrets: inherit

  build-deploy:
    needs: [run-unit-tests]
    permissions:
      contents: read
    uses: ./.github/workflows/build-deploy.yml
    with:
      build-environment: staging
    secrets: inherit

  build-installers:
    needs: [run-unit-tests]
    uses: ./.github/workflows/build-installers.yml
    with:
      # stable uses the PyPI rc stream; without a published rc it falls back to the latest main release.
      build_kind: stable
      minds_api_url: https://api.staging.mindshub.ai
      # Keep git@staging for existing source-aware installs; fresh installs use the rc stream.
      server_ref: staging
      anton_ref: staging
      server_channel: pypi
    secrets: inherit

  notify:
    # Report aggregate failure/recovery, staying quiet for cancellations.
    # pipeline-watchdog handles startup failures with no runnable jobs.
    needs: [run-unit-tests, build-deploy, build-installers]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      actions: read # the prior-run lookup behind the recovery message
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "staging build + installers"
      status: ${{ contains(needs.*.result, 'failure') && 'failed' || 'recovered' }}
      # Escalate to a release-blocking alert only during the freeze window.
      freeze-scoped: true
      runs-on: ubuntu-latest
    secrets: inherit
