name: Staging - Build and Deploy on push to staging

# THE staging pipeline. Unit tests, the web SPA image, and both signed installers
# in one run tree — it used to be three separate runs on the same push, so a merge
# had three places to check and the installers reported to nobody.

on:
  push:
    branches:
      - staging
      # TEMPORARY — REVERT BEFORE MERGE (ENG-1680).
      #
      # Puts this branch on cowork.staging.mindshub.ai without merging it. The
      # branch's cowork-server is already rolled out there, so this is the other
      # half of the same stand. Nothing in the pipeline is branch-aware:
      # `build-deploy.yml` builds whatever code it is handed and rolls it into the
      # `staging` namespace, so the `push` trigger above is the only thing tying
      # the deploy to the `staging` branch.
      #
      # A `push` trigger and not `workflow_dispatch`: GitHub resolves a dispatch
      # against the DEFAULT branch, so that one would have to land on `main`
      # first, while a push event resolves the workflow file from the pushed
      # commit — which is this one.
      #
      # Consequences while this line exists: every push to the branch redeploys
      # the SHARED staging stand, clobbering it for everyone until the next merge
      # to `staging` restores it (that restore is automatic — no revert needed on
      # the environment, only on this file).
      - feat/ENG-1680

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Cancel any existing runs of this workflow on the same branch/pr
# We always want to build/deploy/test a new commit over an older one
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  run-unit-tests:
    uses: ./.github/workflows/tests-unit.yml
    secrets: inherit

  build-deploy:
    needs: [run-unit-tests]
    permissions:
      contents: read
    uses: ./.github/workflows/build-deploy.yml
    with:
      build-environment: staging
    secrets: inherit

  build-installers:
    needs: [run-unit-tests]
    # TEMPORARY — REVERT BEFORE MERGE (ENG-1680). Signed macOS/Windows installers
    # are slow and have nothing to do with what the branch deploy is testing, and
    # `server_ref: staging` below would pin them to the wrong cowork-server anyway.
    # Inert on the real staging pipeline: there this condition is always true.
    if: github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/build-installers.yml
    with:
      # stable -> the PyPI rc stream, following cowork-server's publish-staging
      # track. That track has to be live and to have published an rc; otherwise the
      # floor resolves to the latest MAIN release.
      build_kind: stable
      minds_api_url: https://api.staging.mindshub.ai
      # Still matters for machines already carrying a GIT install of cowork-server:
      # the source-aware updater keeps them on git@staging. Fresh installs use the
      # rc stream above.
      server_ref: staging
    secrets: inherit

  notify:
    # Alert the eng channel if ANY job in the staging pipeline fails. A called
    # workflow reports failure when any job inside it failed, so three entries
    # cover the whole graph.
    # One job covers both outcomes: a `uses:` job cannot branch on status, so
    # the aggregate result picks the failed or recovered message, and a
    # cancelled run stays silent.
    #
    # It cannot cover a run that never started (`startup_failure`, zero jobs) —
    # there is no job to put it in. pipeline-watchdog.yml covers that from outside.
    needs: [run-unit-tests, build-deploy, build-installers]
    # TEMPORARY — REVERT BEFORE MERGE (ENG-1680): the `github.ref` clause only.
    # This job posts "staging build + installers failed/recovered" to the eng
    # channel, and `freeze-scoped: true` can style it as release-blocking. Neither
    # is true of a branch deploy, so a red here would send people looking at the
    # release train for a problem that is one person's in-flight branch.
    if: ${{ github.ref == 'refs/heads/staging' && !cancelled() && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      actions: read # the prior-run lookup behind the recovery message
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "staging build + installers"
      status: ${{ contains(needs.*.result, 'failure') && 'failed' || 'recovered' }}
      # A staging failure is release-blocking once the freeze window is open, and
      # an ordinary integration-branch red before it. `freeze-scoped` keeps the
      # red alert for the former and drops the latter to a muted notice, so the
      # alert still means "look now" when it is styled to say so.
      freeze-scoped: true
      runs-on: ubuntu-latest
    secrets: inherit
