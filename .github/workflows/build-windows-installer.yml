name: Build Windows installer

on:
  workflow_call:
    inputs:
      build_kind:
        description: preview | stable | prod
        required: true
        type: string
      server_ref:
        description: "cowork-server and anton git branch/tag (empty = main)"
        required: false
        type: string
        default: ""
      server_channel:
        description: >-
          Optional override of the cowork-server install channel. Empty (the
          default) derives from build_kind: every packaged kind
          (prod/preview/stable) installs from PyPI, mirroring the runtime
          default in server-source.ts. Pass 'git' (lowercase) to force a
          git-branch install for a build (rare). 'pypi' installs the published
          wheel floored at the latest release.
        required: false
        type: string
        default: ""
      minds_api_url:
        description: >-
          MindsHub API base URL, e.g. https://api.mindshub.ai (prod) or
          https://api.staging.mindshub.ai. Required, and deliberately without a
          default: this one value is baked into BOTH halves of the app
          (gen-build-channel for main, Vite for the renderer) and is the only
          thing keeping them on the same environment. The renderer cannot see
          build_kind, so an absent value makes it fall back to production while
          main falls back on build_kind, and a build whose two halves disagree
          can never complete a login. A default would only make that silent:
          the wrong value does not fail a build, it ships a signed installer
          pointed at the wrong environment.
        required: true
        type: string
      app_version:
        description: >-
          App display version baked into the renderer as __APP_VERSION__.
          Prod builds pass the CalVer release tag (e.g. v2.26.7.1.1).
          Staging/dev builds omit this and fall back to git describe.
        required: false
        type: string
    outputs:
      artifact_name:
        description: Final exe file name (uploaded as the artifact name)
        value: ${{ jobs.build.outputs.artifact_name }}
    secrets:
      SSL_USERNAME:
        required: true
      SSL_PASSWORD:
        required: true
      SSL_CREDENTIAL_ID:
        required: true
      SSL_TOTP_SECRET:
        required: true
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_CALENDAR_CLIENT_ID:
        required: false
      GOOGLE_CALENDAR_CLIENT_SECRET:
        required: false
      GMAIL_CLIENT_ID:
        required: false
      GMAIL_CLIENT_SECRET:
        required: false
      GOOGLE_ADS_CLIENT_ID:
        required: false
      GOOGLE_ADS_CLIENT_SECRET:
        required: false
      GOOGLE_ANALYTICS_CLIENT_ID:
        required: false
      GOOGLE_ANALYTICS_CLIENT_SECRET:
        required: false
      GOOGLE_PICKER_API_KEY:
        required: false
      LINEAR_CLIENT_ID:
        required: false
      LINEAR_CLIENT_SECRET:
        required: false
      VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact_name: ${{ steps.name.outputs.artifact_name }}
    steps:
      # Full clone so git describe can walk history to the nearest CalVer
      # tag. Staging builds (untagged commits) need the distance calculation
      # (e.g. "2.26.6.30.1-3-g1a2b3c4"); a shallow clone can't do this.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Write server credentials
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ANALYTICS_CLIENT_ID: ${{ secrets.GOOGLE_ANALYTICS_CLIENT_ID }}
          GOOGLE_ANALYTICS_CLIENT_SECRET: ${{ secrets.GOOGLE_ANALYTICS_CLIENT_SECRET }}
          GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}

        run: |
          python -c "
          import os, json
          creds = {k: os.environ.get(k, '') for k in [
            'GOOGLE_DRIVE_CLIENT_ID', 'GOOGLE_DRIVE_CLIENT_SECRET',
            'GOOGLE_CALENDAR_CLIENT_ID', 'GOOGLE_CALENDAR_CLIENT_SECRET',
            'GMAIL_CLIENT_ID', 'GMAIL_CLIENT_SECRET',
            'GOOGLE_ADS_CLIENT_ID', 'GOOGLE_ADS_CLIENT_SECRET',
            'GOOGLE_ANALYTICS_CLIENT_ID', 'GOOGLE_ANALYTICS_CLIENT_SECRET',
            'GOOGLE_PICKER_API_KEY',
            'LINEAR_CLIENT_ID', 'LINEAR_CLIENT_SECRET',
          ]}
          with open('server-credentials.json', 'w') as f:
              json.dump(creds, f)
          "

      - name: Write build config (controls which cowork data home the app uses)
        shell: bash
        run: echo '{"buildKind":"${{ inputs.build_kind }}"}' > build-config.json

      # cowork-server install channel: an explicit server_channel input wins;
      # otherwise every packaged build kind installs from PyPI (prod = stable
      # stream, preview/stable = rc stream). Mirrors server-source.ts
      # (_channelForBuildKind) so the floor step and the baked channel agree
      # with what the app resolves at runtime.
      - name: Resolve install channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          CH="${{ inputs.server_channel }}"
          if [ -z "$CH" ]; then
            case "${{ inputs.build_kind }}" in
              prod|preview|stable) CH=pypi ;;
              *) CH='' ;;
            esac
          fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "Install channel: ${CH:-git} (build_kind=${{ inputs.build_kind }})"

      # PyPI-channel builds bake the latest published cowork-server version
      # as the install floor: every fresh install starts from a release that
      # existed (and was presumably healthy) at build time, while the
      # auto-updater still moves installs forward as new versions publish.
      # Failing the build on a PyPI outage is deliberate — better than
      # shipping an unknown floor.
      - name: Resolve cowork-server version floor (pypi channel only)
        if: steps.channel.outputs.channel == 'pypi'
        id: server_floor
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(curl -fsSL --retry 3 https://pypi.org/pypi/cowork-server/json)
          if [ "${{ inputs.build_kind }}" = "prod" ]; then
            # Stable floor: PyPI's info.version excludes pre-releases.
            VERSION=$(echo "$JSON" | jq -r '.info.version')
          else
            # Staging rc stream: newest non-yanked upload, pre-releases
            # included (upload recency stands in for PEP 440 ordering).
            VERSION=$(echo "$JSON" | jq -r '[.releases | to_entries[] | select(.key | test("^[0-9]+(\\.[0-9]+)*(rc[0-9]+)?$")) | select((.value | length) > 0) | select(any(.value[]; .yanked != true)) | {v: .key, t: ([.value[].upload_time_iso_8601] | max)}] | sort_by(.t) | last | .v')
          fi
          test -n "$VERSION" && test "$VERSION" != "null"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Baking cowork-server floor $VERSION (build_kind=${{ inputs.build_kind }})"

      - name: Build Windows installer (unsigned)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN: ${{ secrets.VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN }}
          # Both refs come from the same input so a staging build pins staging
          # cowork-server AND staging anton. server-source.ts overrides anton's
          # source at install time via --no-sources-package + --with, so this
          # does not require any per-branch pin in cowork-server's pyproject.
          COWORK_SERVER_REF: ${{ inputs.server_ref }}
          ANTON_REF: ${{ inputs.server_ref }}
          COWORK_SERVER_CHANNEL: ${{ steps.channel.outputs.channel }}
          COWORK_SERVER_MIN_VERSION: ${{ steps.server_floor.outputs.version }}
          VITE_MINDS_API_URL: ${{ inputs.minds_api_url }}
          VITE_APP_VERSION: ${{ inputs.app_version }}

      - name: Resolve installer path
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem release\*.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer .exe found in release/" }
          "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve app executable path
        id: app_exe
        shell: pwsh
        run: |
          $appExe = Get-ChildItem release\win-unpacked\*.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'Uninstall' } |
            Select-Object -First 1
          if ($appExe) {
            "has_app_exe=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "app_exe_path=$($appExe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "has_app_exe=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Resolve uninstaller path
        id: uninstaller
        shell: pwsh
        run: |
          $uninstaller = Get-ChildItem release\win-unpacked\*.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'Uninstall' } |
            Select-Object -First 1
          if ($uninstaller) {
            "has_uninstaller=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "uninstaller_path=$($uninstaller.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "has_uninstaller=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Sign installer with SSL.com eSigner
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.SSL_USERNAME }}
          password: ${{ secrets.SSL_PASSWORD }}
          credential_id: ${{ secrets.SSL_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSL_TOTP_SECRET }}
          file_path: ${{ steps.installer.outputs.exe_path }}
          output_path: ${{ github.workspace }}\signed

      - name: Sign app executable with SSL.com eSigner
        if: steps.app_exe.outputs.has_app_exe == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.SSL_USERNAME }}
          password: ${{ secrets.SSL_PASSWORD }}
          credential_id: ${{ secrets.SSL_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSL_TOTP_SECRET }}
          file_path: ${{ steps.app_exe.outputs.app_exe_path }}
          output_path: ${{ github.workspace }}\signed

      - name: Sign uninstaller with SSL.com eSigner
        if: steps.uninstaller.outputs.has_uninstaller == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.SSL_USERNAME }}
          password: ${{ secrets.SSL_PASSWORD }}
          credential_id: ${{ secrets.SSL_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSL_TOTP_SECRET }}
          file_path: ${{ steps.uninstaller.outputs.uninstaller_path }}
          output_path: ${{ github.workspace }}\signed

      - name: Replace unsigned installer with signed output
        shell: pwsh
        run: |
          $unsignedPath = "${{ steps.installer.outputs.exe_path }}"
          $fileName = Split-Path $unsignedPath -Leaf
          $signedPath = Join-Path "$env:GITHUB_WORKSPACE\signed" $fileName
          if (!(Test-Path $signedPath)) {
            throw "Signed file not found at $signedPath"
          }
          Copy-Item $signedPath $unsignedPath -Force

      - name: Replace unsigned app executable with signed output
        if: steps.app_exe.outputs.has_app_exe == 'true'
        shell: pwsh
        run: |
          $unsignedPath = "${{ steps.app_exe.outputs.app_exe_path }}"
          $fileName = Split-Path $unsignedPath -Leaf
          $signedPath = Join-Path "$env:GITHUB_WORKSPACE\signed" $fileName
          if (!(Test-Path $signedPath)) {
            throw "Signed app executable not found at $signedPath"
          }
          Copy-Item $signedPath $unsignedPath -Force

      - name: Replace unsigned uninstaller with signed output
        if: steps.uninstaller.outputs.has_uninstaller == 'true'
        shell: pwsh
        run: |
          $unsignedPath = "${{ steps.uninstaller.outputs.uninstaller_path }}"
          $fileName = Split-Path $unsignedPath -Leaf
          $signedPath = Join-Path "$env:GITHUB_WORKSPACE\signed" $fileName
          if (!(Test-Path $signedPath)) {
            throw "Signed uninstaller not found at $signedPath"
          }
          Copy-Item $signedPath $unsignedPath -Force

      - name: Verify installer signature
        shell: pwsh
        run: |
          $exe = "${{ steps.installer.outputs.exe_path }}"
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if ($signtool) {
            & $signtool verify /pa /all /v "$exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }
          } else {
            Write-Host "signtool.exe not found in Windows SDK path, using Get-AuthenticodeSignature fallback"
          }

          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid') {
            throw "Signature verification failed. Status: $($signature.Status) - $($signature.StatusMessage)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "Timestamp verification failed: signature does not include a timestamp certificate."
          }

      - name: Verify app executable signature
        if: steps.app_exe.outputs.has_app_exe == 'true'
        shell: pwsh
        run: |
          $exe = "${{ steps.app_exe.outputs.app_exe_path }}"
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if ($signtool) {
            & $signtool verify /pa /all /v "$exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for app executable with exit code $LASTEXITCODE" }
          }
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid') {
            throw "App executable signature verification failed. Status: $($signature.Status) - $($signature.StatusMessage)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "App executable timestamp verification failed: no timestamp certificate."
          }

      - name: Verify uninstaller signature
        if: steps.uninstaller.outputs.has_uninstaller == 'true'
        shell: pwsh
        run: |
          $exe = "${{ steps.uninstaller.outputs.uninstaller_path }}"
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if ($signtool) {
            & $signtool verify /pa /all /v "$exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for uninstaller with exit code $LASTEXITCODE" }
          }
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid') {
            throw "Uninstaller signature verification failed. Status: $($signature.Status) - $($signature.StatusMessage)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "Uninstaller timestamp verification failed: no timestamp certificate."
          }

      - name: Compute artifact name
        id: name
        shell: bash
        run: |
          set -euo pipefail
          # gen-build-channel.mjs (prebuild:main) resolves the display version once
          # during the build and writes it here, so the filename matches the version
          # the app reports (__APP_VERSION__). Fall back to package.json if absent.
          VERSION_FILE="src/main/app-version.gen.txt"
          if [ -s "$VERSION_FILE" ]; then
            VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          SHA="${GITHUB_SHA::7}"
          # Untagged builds carry `git describe`'s <tag>-<N>-g<sha> suffix; the
          # preview/stable names already append -${SHA}, so strip that suffix to
          # avoid the commit sha appearing twice. A clean release tag (prod) has
          # no such suffix, so this is a no-op there.
          VERSION_FN="$VERSION"
          case "${{ inputs.build_kind }}" in
            preview|stable) VERSION_FN=$(printf '%s' "$VERSION" | sed -E 's/-[0-9]+-g[0-9a-f]+$//') ;;
          esac
          case "${{ inputs.build_kind }}" in
            preview) NAME="mindshub-cowork-${VERSION_FN}-preview-${SHA}.exe" ;;
            stable)  NAME="mindshub-cowork-${VERSION_FN}-stable-${SHA}.exe"  ;;
            prod)    NAME="mindshub-cowork-${VERSION}.exe" ;;
            *) echo "Unknown build_kind: ${{ inputs.build_kind }}"; exit 1 ;;
          esac
          echo "artifact_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Computed artifact name: ${NAME}"

      - name: Rename exe
        shell: pwsh
        run: |
          $name = "${{ steps.name.outputs.artifact_name }}"
          $out = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $src = "${{ steps.installer.outputs.exe_path }}"
          $dest = Join-Path $out $name
          Move-Item $src $dest -Force

      - name: Generate installer signing report
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "out\${{ steps.name.outputs.artifact_name }}"
          $reportDir = Join-Path $env:GITHUB_WORKSPACE "out\signing-report"
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

          $signature = Get-AuthenticodeSignature -FilePath $exe
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash
          $fileName = Split-Path $exe -Leaf

          $report = [ordered]@{
            file = $fileName
            filePath = $exe
            sha256 = $hash
            status = "$($signature.Status)"
            statusMessage = "$($signature.StatusMessage)"
            signerSubject = "$($signature.SignerCertificate.Subject)"
            signerThumbprint = "$($signature.SignerCertificate.Thumbprint)"
            signerNotBefore = "$($signature.SignerCertificate.NotBefore)"
            signerNotAfter = "$($signature.SignerCertificate.NotAfter)"
            timestampSubject = "$($signature.TimeStamperCertificate.Subject)"
            timestampThumbprint = "$($signature.TimeStamperCertificate.Thumbprint)"
            timestampNotAfter = "$($signature.TimeStamperCertificate.NotAfter)"
            buildKind = "${{ inputs.build_kind }}"
          }

          $jsonPath = Join-Path $reportDir "installer-signature-report.json"
          $txtPath = Join-Path $reportDir "installer-signature-report.txt"

          $report | ConvertTo-Json -Depth 5 | Set-Content -Path $jsonPath -Encoding UTF8
          @(
            "file: $($report.file)"
            "sha256: $($report.sha256)"
            "status: $($report.status)"
            "statusMessage: $($report.statusMessage)"
            "signerSubject: $($report.signerSubject)"
            "signerThumbprint: $($report.signerThumbprint)"
            "signerNotAfter: $($report.signerNotAfter)"
            "timestampSubject: $($report.timestampSubject)"
            "timestampThumbprint: $($report.timestampThumbprint)"
            "timestampNotAfter: $($report.timestampNotAfter)"
            "buildKind: $($report.buildKind)"
          ) | Set-Content -Path $txtPath -Encoding UTF8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: out/
          if-no-files-found: error
