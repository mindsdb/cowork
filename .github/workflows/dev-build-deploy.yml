name: Dev - Build and Deploy on PR

# THE pull-request pipeline. Everything a PR triggers lands in this one run tree:
# unit tests, the web SPA image, the wait for the per-PR environment, and, when
# the PR asks for them by label, the signed desktop installers.
#
# It used to be three separate runs on the same event (this file, tests-unit.yml,
# and dev-build-installer.yml), so "did this commit pass" had three answers in three
# places and the installers finished with nobody told.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Cancel any existing runs of this workflow on the same branch/pr
# We always want to build/deploy/test a new commit over an older one
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  # One gate answering "should the cluster-side pipeline run at all", for two
  # reasons that were previously handled in different places or not at all.
  #
  # FORK PRs. A fork's run gets no secrets, and GitHub will not mint it the OIDC
  # token that the image build and the installer upload trade for AWS
  # credentials. Both would fail, so the gate skips them and says why. Every job
  # runs on a GitHub-hosted runner, so a fork's code never reaches our
  # infrastructure either way.
  #
  # PROMOTION PRs. A `staging` -> `main` PR promotes commits the staging pipeline
  # already built. This cannot be a trigger filter: for `pull_request`, GitHub's
  # `branches` filters match the pull request's BASE branch, and the only lever on
  # the head branch is a job-level conditional.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether this PR needs the cluster-side pipeline
        id: decide
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Build skipped: fork pull request"
              echo
              echo "The image and installer builds need repository secrets and AWS"
              echo "credentials, which GitHub does not give a fork's run. The unit tests"
              echo "below still run."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HEAD_REF" = "staging" ] || [ "$HEAD_REF" = "main" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Build skipped: promotion PR"
              echo
              echo "\`$HEAD_REF\` -> \`$BASE_REF\` promotes commits the \`$HEAD_REF\`"
              echo "pipeline already built and tested."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  run-unit-tests:
    # Deliberately ungated: ubuntu-latest, no secrets, so a fork contributor gets
    # the CI that matters to them.
    uses: ./.github/workflows/tests-unit.yml
    secrets: inherit

  workflow-lint:
    # actionlint, the caller/callee permission check, and a zizmor audit, shared
    # with every other service repo. Ungated for the same reason as the tests.
    permissions:
      contents: read
    uses: mindsdb/github-actions/.github/workflows/workflow-lint.yml@main
    with:
      default-permissions: read
    secrets: inherit

  build-deploy:
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: read
      id-token: write # the build and the scan assume the dev-tier ECR role
    uses: ./.github/workflows/build-deploy.yml
    with:
      build-environment: development
    secrets: inherit

  # mindsdb/deployer rolls the PR environment out, not this run. Every ten
  # minutes its reconciler syncs each open same-repo pull request labelled
  # `deploy` whose `development-head-<head sha>` image exists. So this job asks
  # the environment itself, over its public host, until the host serves a build
  # of this pull request's head.
  #
  # The build stamps that head into the bundle as VITE_APP_VERSION (see
  # build-deploy.yml), in the entry chunk that index-web.html loads. The shell is
  # served no-cache, and a chunk's name is its content hash, so each chunk is
  # read once. No secrets and no token scope: the host is public.
  #
  # It waits on the whole build-deploy call, scan included. On a pull request
  # the scan's findings are advisory, but a scan that cannot run (a failed Snyk
  # or ECR login) still fails the call. This job is then skipped and the comment
  # reports `absent`, while the reconciler still rolls the pushed image out.
  pr-env-wait:
    needs: [gate, build-deploy]
    if: needs.gate.outputs.run == 'true' && contains(github.event.pull_request.labels.*.name, 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    environment:
      name: pr-cowork-${{ github.event.pull_request.number }}
      url: https://pr-cowork-${{ github.event.pull_request.number }}.dev.mindshub.ai
    outputs:
      up: ${{ steps.wait.outputs.up }}
    steps:
      - name: Wait for the PR environment to serve this build
        id: wait
        env:
          HOST: https://cowork-pr-cowork-${{ github.event.pull_request.number }}.dev.mindshub.ai
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # An empty value would match any bundle.
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected pull request head SHA: '${HEAD_SHA}'"
            exit 1
          fi
          entry_re='<script type="module"[^>]* src="(/assets/[^"]+\.js)"'
          checked=""
          deadline=$((SECONDS + 40 * 60))
          while ((SECONDS < deadline)); do
            if shell=$(curl -fsS --max-time 20 "$HOST/") && [[ "$shell" =~ $entry_re ]]; then
              entry="${BASH_REMATCH[1]}"
              if [ "$entry" != "$checked" ] && curl -fsS --max-time 120 -o entry.js "${HOST}${entry}"; then
                if grep -qF "$HEAD_SHA" entry.js; then
                  echo "up=true" >> "$GITHUB_OUTPUT"
                  echo "${HOST} serves a build of ${HEAD_SHA}."
                  exit 0
                fi
                checked="$entry"
              fi
            fi
            sleep 30
          done
          echo "::error::${HOST} did not serve a build of ${HEAD_SHA} within 40 minutes. The mindsdb/deployer reconciler rolls PR environments out every 10 minutes, so its pr-envs runs say why."
          exit 1

  pr-env-comment:
    # `up` once the PR host serves this head's build, and `absent` otherwise:
    # without the `deploy` label no environment exists, and a wait that ran out
    # means the reconciler never rolled this build out.
    #
    # This repo is PUBLIC, so the shared reusable drops the runbook link and the
    # notes by itself; the hosts stay because they are what a reviewer came for.
    needs: [gate, pr-env-wait]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: mindsdb/github-actions/.github/workflows/pr-env-comment.yml@main
    with:
      env-name: pr-cowork-${{ github.event.pull_request.number }}
      status: ${{ needs.pr-env-wait.outputs.up == 'true' && 'up' || 'absent' }}
    secrets: inherit

  # Installers, per platform, by label. Not only a build-cost question: the
  # upload jobs carry no `if:` of their own, so a platform's label is also what
  # stops `upload-installer-to-s3.yml`, which holds a write role on the
  # production installer bucket, from writing a preview build there and posting
  # its public URL on the PR. So every platform opts in, linux included.
  build-installers:
    needs: [gate]
    if: >-
      ${{ needs.gate.outputs.run == 'true'
          && (contains(github.event.pull_request.labels.*.name, 'signed-macos-pkg')
              || contains(github.event.pull_request.labels.*.name, 'signed-windows-ev')
              || contains(github.event.pull_request.labels.*.name, 'build-linux-deb')) }}
    permissions:
      contents: read
      id-token: write # the uploads assume the preview installer role
    uses: ./.github/workflows/build-installers.yml
    with:
      build_kind: preview
      # A PR build tests staging. Stating it keeps main and the renderer on one
      # environment; leaving it to the default splits them and login can never
      # succeed.
      minds_api_url: https://api.staging.mindshub.ai
      # Kept for machines already carrying a GIT install of cowork-server (the
      # updater is source-aware). Fresh installs follow the PyPI rc stream that
      # build_kind implies.
      server_ref: staging
      anton_ref: staging
      server_channel: pypi
      macos: ${{ contains(github.event.pull_request.labels.*.name, 'signed-macos-pkg') }}
      windows: ${{ contains(github.event.pull_request.labels.*.name, 'signed-windows-ev') }}
      # Stated rather than left to default:true — an omitted platform input
      # publishes on every push. One label covers both arches.
      linux_amd64: ${{ contains(github.event.pull_request.labels.*.name, 'build-linux-deb') }}
      linux_arm64: ${{ contains(github.event.pull_request.labels.*.name, 'build-linux-deb') }}
    secrets: inherit

  # The installers are the deliverable on a desktop PR, and they used to land in an
  # S3 bucket whose URL was written only into a job summary. Put them in front of
  # the reviewer.
  #
  # Split in two because a `uses:` job cannot have steps: this composes the link
  # list (either platform may be absent), the next posts it.
  compose-installer-links:
    needs: [build-installers]
    if: ${{ !cancelled() && needs.build-installers.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      links: ${{ steps.compose.outputs.links }}
    steps:
      - id: compose
        env:
          MAC_URL: ${{ needs.build-installers.outputs.macos_download_url }}
          WIN_URL: ${{ needs.build-installers.outputs.windows_download_url }}
          LINUX_AMD64_URL: ${{ needs.build-installers.outputs.linux_amd64_download_url }}
          LINUX_ARM64_URL: ${{ needs.build-installers.outputs.linux_arm64_download_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # jq builds it, so a file name carrying a quote or a space cannot produce
          # malformed JSON the comment job would then fail to parse.
          jq -cn \
            --arg mac "${MAC_URL:-}" --arg win "${WIN_URL:-}" \
            --arg linux_amd64 "${LINUX_AMD64_URL:-}" --arg linux_arm64 "${LINUX_ARM64_URL:-}" \
            --arg run "$RUN_URL" '
              [ ( if $mac != "" then {label: "macOS installer (.pkg)", url: $mac} else empty end ),
                ( if $win != "" then {label: "Windows installer (.exe)", url: $win} else empty end ),
                ( if $linux_amd64 != "" then {label: "Linux installer (.deb, amd64)", url: $linux_amd64} else empty end ),
                ( if $linux_arm64 != "" then {label: "Linux installer (.deb, arm64)", url: $linux_arm64} else empty end ),
                {label: "Build run", url: $run} ]
            ' | tee links.json
          echo "links=$(cat links.json)" >> "$GITHUB_OUTPUT"

  installer-comment:
    needs: [compose-installer-links]
    permissions:
      contents: read
      pull-requests: write
    uses: mindsdb/github-actions/.github/workflows/pr-env-comment.yml@main
    with:
      heading: "Installers built"
      env-name: preview
      # Not an environment: no service table, no default-tag note.
      standard-links: false
      # Its own marker, so it rolls independently of the environment comment.
      marker: pr-installer-artifacts
      links: ${{ needs.compose-installer-links.outputs.links }}
    secrets: inherit
