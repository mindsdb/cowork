name: Sync main to staging

# run-tree-ok: a release-train hook, not a stage of this repo's push:main pipeline.
# Folding it in as a `workflow_call` job would make the sync conditional on that
# pipeline running AND succeeding, which is the exact failure it exists to prevent:
# a hotfix whose deploy fails still has to reach staging, or the next release PR is
# diffed against a main that staging does not contain. It also keeps the App-token
# push out of the deploy pipeline's permission envelope.

# Sync hotfixes, reverts, and other main commits that do not trigger the staging-PR unfreeze workflow.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Share concurrency with staging-unfreeze so simultaneous App-token pushes serialize.
concurrency:
  group: sync-main-to-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # The reusable owns failure and recovery notifications.
    permissions:
      contents: read
      # actions: read enables recovery lookup; the reusable must inherit this grant without capping it.
      actions: read
    uses: mindsdb/github-actions/.github/workflows/sync-main-to-staging.yml@main
    secrets: inherit
