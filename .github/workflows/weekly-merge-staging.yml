name: Create staging to main release PR

# Maintain a draft release PR after staging pipelines; mark ready only when freeze opens.
# workflow_run avoids a duplicate disconnected push pipeline.

on:
  workflow_run:
    workflows: ["Staging Freeze", "Staging - Build and Deploy on push to staging"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the non-atomic read/create release-PR sequence. Do not cancel later runs: their commit list is newer.
concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  create-pr:
    # Require successful freeze, but refresh queued commits after any staging-pipeline result.
    # Check pipeline head_branch; scheduled freeze runs are attributed to default-branch main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name == 'Staging Freeze' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event.workflow_run.name == 'Staging - Build and Deploy on push to staging' &&
       github.event.workflow_run.head_branch == 'staging')
    permissions:
      contents: read
      # actions: read enables recovery lookup; the reusable must inherit this grant without capping it.
      actions: read
    uses: mindsdb/github-actions/.github/workflows/release-pr.yml@main
    secrets: inherit
