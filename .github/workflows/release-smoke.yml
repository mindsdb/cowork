name: Release smoke (public downloads)

# Verify public CDN headers, resumable downloads, and checksums after release and nightly.
# Keep off PR gates: failures may reflect live infrastructure rather than the commit.

# Release callers must pin both prod channel and the new version; otherwise smoke could test staging or an older release.
on:
  workflow_call:
    inputs:
      channels:
        description: 'Download channels to check, comma-separated: prod, stable'
        type: string
        required: false
        default: prod,stable
      version:
        description: 'Version this release published; asserted against the prod manifest'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '0 7 * * *' # nightly, an hour after the Electron e2e smoke
  workflow_dispatch:
    inputs:
      channels:
        description: 'Download channels to check, comma-separated: prod, stable'
        type: string
        required: false
        default: prod,stable
      version:
        description: 'Version to assert against the prod manifest; blank to skip'
        type: string
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  downloads:
    runs-on: ubuntu-latest
    # Allow time for full installer downloads and resume reassembly across selected platforms/channels.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry
        with:
          command: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download the published installers and check them
        env:
          # Schedule has no inputs: default to both channels without a pinned version.
          RELEASE_SMOKE_CHANNELS: ${{ inputs.channels || 'prod,stable' }}
          RELEASE_SMOKE_VERSION: ${{ inputs.version }}
        run: npm run test:release-smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-smoke-traces
          path: test-results/
          retention-days: 7
