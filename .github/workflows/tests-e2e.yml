name: Tests (e2e)

# Nightly/manual Electron launch smoke requires a display and full build.
# Promote to a PR gate only after it proves reliable.

on:
  schedule:
    - cron: '0 6 * * *' # nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry
        with:
          command: npm ci
      - name: Build main + renderer
        run: npm run build
      - name: Install Electron Linux runtime deps
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0
      - name: Run Playwright Electron smoke (headless via xvfb)
        run: xvfb-run --auto-servernum -- npx playwright test
        env:
          # Expose main-process logs so crashes do not appear only as firstWindow timeouts.
          DEBUG: pw:browser*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
