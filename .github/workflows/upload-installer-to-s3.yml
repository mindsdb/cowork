name: Upload installer to S3

on:
  workflow_call:
    inputs:
      platform:
        description: mac | windows
        required: true
        type: string
      build_kind:
        description: preview | stable | prod
        required: true
        type: string
      artifact_name:
        description: Artifact name produced by the build workflow (also the final file name)
        required: true
        type: string
    outputs:
      download_url:
        description: >-
          Public CloudFront URL of the uploaded installer. Exposed so the calling
          pipeline can put it in front of a reviewer — the job summary is only
          found by someone who already went looking.
        value: ${{ jobs.upload.outputs.download_url }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  upload:
    runs-on: mdb-prod
    outputs:
      download_url: ${{ steps.s3.outputs.download_url }}
    steps:
      # The manifest writer lives in the repo, so this job needs the tree as
      # well as the build artifact.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: out

      - name: Validate Windows signing report before upload
        if: inputs.platform == 'windows'
        run: |
          set -euo pipefail
          REPORT_JSON="out/signing-report/installer-signature-report.json"
          if [ ! -f "$REPORT_JSON" ]; then
            echo "::error::Missing signing report: $REPORT_JSON"
            ls -la out || true
            exit 1
          fi
          # shellcheck disable=SC2016  # the JS below must NOT be shell-expanded
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const r = JSON.parse(fs.readFileSync(p, "utf8"));
            const required = ["status", "signerSubject", "timestampSubject", "sha256"];
            for (const k of required) {
              if (!r[k]) {
                console.error(`::error::signing-report missing field: ${k}`);
                process.exit(1);
              }
            }
            if (r.status !== "Valid") {
              console.error(`::error::Invalid signature status: ${r.status} (${r.statusMessage || ""})`);
              process.exit(1);
            }
            console.log(`Windows signing report OK: ${r.file} sha256=${r.sha256}`);
          ' "$REPORT_JSON"

      - name: Upload to S3
        id: s3
        env:
          PLATFORM: ${{ inputs.platform }}
          KIND: ${{ inputs.build_kind }}
          NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          BUCKET="anton-installer"
          PREFIX="mindshub-cowork/${PLATFORM}"
          EXT="${NAME##*.}"
          SRC="out/${NAME}"

          if [ ! -f "$SRC" ]; then
            echo "::error::Expected file $SRC not found in downloaded artifact"
            ls -la out || true
            exit 1
          fi
          LOCAL_SHA=$(sha256sum "$SRC" | awk '{print $1}')

          REGION=$(aws s3api get-bucket-location --bucket "$BUCKET" --query LocationConstraint --output text 2>/dev/null || echo "")
          if [ -z "$REGION" ] || [ "$REGION" = "None" ] || [ "$REGION" = "null" ]; then
            REGION="us-east-1"
          fi
          HTTPS_BASE="https://${BUCKET}.s3.${REGION}.amazonaws.com"
          CDN_BASE="https://downloads.mindshub.ai"

          # A versioned key's bytes never change, so it can be cached for a year
          # and a resume can trust a validator that never moves. The aliases are
          # rewritten every release, so they get a minute: long enough to absorb
          # a download spike, short enough that a stale copy is not the story.
          # Without either header CloudFront falls back to its own hour.
          IMMUTABLE_CACHE="public, max-age=31536000, immutable"
          ALIAS_CACHE="public, max-age=60"
          # Serve installers as opaque bytes named after the version they are,
          # so a file saved from the alias URL is not called "...-latest.pkg".
          INSTALLER_TYPE="application/octet-stream"
          DISPOSITION="attachment; filename=\"${NAME}\""

          UPLOADED_KEYS=()
          VERSIONED_KEY=""

          upload_installer() {
            local src="$1" key="$2" cache="$3"
            aws s3 cp "$src" "s3://${BUCKET}/${key}" \
              --cache-control "$cache" \
              --content-type "$INSTALLER_TYPE" \
              --content-disposition "$DISPOSITION"
          }

          # Is this key already published? head-object exits non-zero for more
          # reasons than "no": a 403, a SlowDown throttle and an expired token
          # all look identical to a miss if you only read the exit status. Any
          # of them would fall through to the overwrite that the create-only
          # rule below exists to prevent, and do it silently. So only a genuine
          # 404 counts as absent; everything else stops the release.
          key_exists() {
            local key="$1" err
            if err=$(aws s3api head-object --bucket "$BUCKET" --key "$key" 2>&1 >/dev/null); then
              return 0
            fi
            case "$err" in
              *"(404)"* | *"Not Found"*) return 1 ;;
              *)
                echo "::error::Cannot tell whether ${key} is already published, so refusing to write it: ${err}"
                exit 1
                ;;
            esac
          }

          # Publish a version's bytes exactly once. Signing and notarisation
          # stamp a timestamp, so rebuilding a version yields different bytes
          # under the same name, and taking the new ones would change what an
          # already-advertised URL serves. Identical bytes are a no-op;
          # different bytes stop the release rather than replacing anything.
          publish_versioned() {
            local src="$1" key="$2"
            local tmp published
            if key_exists "$key"; then
              tmp="$(mktemp)"
              aws s3 cp "s3://${BUCKET}/${key}" "$tmp" >/dev/null
              published=$(sha256sum "$tmp" | awk '{print $1}')
              rm -f "$tmp"
              if [ "$published" != "$LOCAL_SHA" ]; then
                echo "::error::Refusing to overwrite ${key}: it is already published with different bytes (published=${published} built=${LOCAL_SHA}). Cut a new version rather than republishing this one."
                exit 1
              fi
              echo "Already published and byte-identical, skipping re-upload: ${key}"
            else
              upload_installer "$src" "$key" "$IMMUTABLE_CACHE"
            fi
            VERSIONED_KEY="$key"
            UPLOADED_KEYS+=("$key")
          }

          # Previews are the one kind that overwrites. They are per-pull-request
          # and get rebuilt whenever anyone re-runs the job, and re-signing
          # changes the bytes under the same name, so the create-only rule would
          # answer an ordinary re-run with "cut a new version" on a branch that
          # has no versions to cut. They carry the short alias TTL rather than
          # `immutable`, because advertising a key as immutable while
          # overwriting it is exactly what strands a stale copy at the edge.
          publish_preview() {
            local src="$1" key="$2"
            upload_installer "$src" "$key" "$ALIAS_CACHE"
            VERSIONED_KEY="$key"
            UPLOADED_KEYS+=("$key")
          }

          # The alias is a server-side copy of the key just published, never a
          # second upload of the local file. Copying makes "the alias serves the
          # version the manifest names" a property of how it is written, instead
          # of something two independent uploads have to agree on.
          publish_alias() {
            local key="$1"
            aws s3 cp "s3://${BUCKET}/${VERSIONED_KEY}" "s3://${BUCKET}/${key}" \
              --metadata-directive REPLACE \
              --cache-control "$ALIAS_CACHE" \
              --content-type "$INSTALLER_TYPE" \
              --content-disposition "$DISPOSITION"
            UPLOADED_KEYS+=("$key")
          }

          case "$KIND" in
            preview)
              publish_preview "$SRC" "${PREFIX}/previews/${NAME}"
              ;;
            stable)
              publish_versioned "$SRC" "${PREFIX}/snapshots/${NAME}"
              publish_alias "${PREFIX}/mindshub-cowork-staging.${EXT}"
              ;;
            prod)
              publish_versioned "$SRC" "${PREFIX}/${NAME}"
              publish_alias "${PREFIX}/mindshub-cowork-latest.${EXT}"
              ;;
            *)
              echo "::error::Unknown build_kind: $KIND"
              exit 1
              ;;
          esac

          echo ""
          echo "Uploaded ${#UPLOADED_KEYS[@]} object(s) to s3://${BUCKET} (region: ${REGION})"
          echo ""
          {
            echo "### Installer uploaded to S3"
            echo ""
            echo "- **Platform**: \`${PLATFORM}\`"
            echo "- **Build kind**: \`${KIND}\`"
            echo "- **Bucket**: \`${BUCKET}\` (\`${REGION}\`)"
            echo ""
            echo "| S3 URI | Object URL | Public download URL |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for KEY in "${UPLOADED_KEYS[@]}"; do
            S3_URI="s3://${BUCKET}/${KEY}"
            OBJECT_URL="${HTTPS_BASE}/${KEY}"
            # CloudFront (downloads.mindshub.ai) fronts the bucket root with no
            # path rewriting, so the public URL preserves the full object key.
            CDN_URL="${CDN_BASE}/${KEY}"
            echo "  ${S3_URI}"
            echo "  ${OBJECT_URL}"
            echo "  ${CDN_URL}"
            echo "| \`${S3_URI}\` | ${OBJECT_URL} | ${CDN_URL} |" >> "$GITHUB_STEP_SUMMARY"

            TMP_FILE="$(mktemp)"
            aws s3 cp "${S3_URI}" "$TMP_FILE" >/dev/null
            REMOTE_SHA=$(sha256sum "$TMP_FILE" | awk '{print $1}')
            rm -f "$TMP_FILE"
            if [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
              echo "::error::SHA256 mismatch for ${S3_URI}. local=${LOCAL_SHA} remote=${REMOTE_SHA}"
              exit 1
            fi
            echo "| \`${S3_URI}\` | ✅ sha256 verified (\`${REMOTE_SHA}\`) | ${CDN_URL} |" >> "$GITHUB_STEP_SUMMARY"
          done

          # Where this step wrote, so the steps after it don't restate the
          # bucket and prefix as literals and drift from it.
          {
            echo "bucket=${BUCKET}"
            echo "prefix=${PREFIX}"
            echo "versioned_key=${VERSIONED_KEY}"
            echo "download_url=${CDN_BASE}/${VERSIONED_KEY}"
          } >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "### Public download URLs"
            echo ""
            echo "These installers are served via CloudFront at https://downloads.mindshub.ai (see \`terraform/newprod/us-east-1/anton/cloudfront.tf\`):"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for KEY in "${UPLOADED_KEYS[@]}"; do
            echo "- ${CDN_BASE}/${KEY}" >> "$GITHUB_STEP_SUMMARY"
          done

      # The manifest is how a browser client finds the current installer: which
      # version is live, the immutable URL that serves it, and the sha256 to
      # check the finished file against. It is written last, after the loop
      # above has confirmed the bytes it names are in the bucket, so it can
      # never point at something that does not exist yet.
      - name: Publish public download manifest
        if: inputs.build_kind == 'prod' || inputs.build_kind == 'stable'
        env:
          KIND: ${{ inputs.build_kind }}
          NAME: ${{ inputs.artifact_name }}
          BUCKET: ${{ steps.s3.outputs.bucket }}
          PREFIX: ${{ steps.s3.outputs.prefix }}
          VERSIONED_KEY: ${{ steps.s3.outputs.versioned_key }}
        run: |
          set -euo pipefail
          # One manifest per channel, named after the alias it supersedes, so a
          # consumer already reading `-latest` or `-staging` knows which is its
          # own without a lookup table.
          MANIFEST_NAME=$([ "$KIND" = "prod" ] && echo latest.json || echo staging.json)

          node scripts/write-download-manifest.mjs \
            --artifact "out/${NAME}" \
            --key "$VERSIONED_KEY" \
            --channel "$KIND" \
            --cdn-base "https://downloads.mindshub.ai" \
            --output "$MANIFEST_NAME"

          aws s3 cp "$MANIFEST_NAME" "s3://${BUCKET}/${PREFIX}/${MANIFEST_NAME}" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

      # Prove over the public CDN what the release claims: the manifest resolves
      # to the bytes this run built, and the URL it names can be resumed.
      #
      # Every assertion here reads the body rather than the status line. A
      # status can no longer hide a missing key, now that the distribution
      # answers one with a 404, but it still cannot tell a current object from
      # a stale one, which is the failure an immutable key is most exposed to.
      #
      # The wait is an explicit loop rather than `curl --retry`, which fires
      # only on a timeout or a 408/429/5xx. A newly created key can be shadowed
      # by an edge that cached the 404 for it moments earlier, and no retry
      # flag covers that.
      - name: Verify the published download over the CDN
        if: inputs.build_kind == 'prod' || inputs.build_kind == 'stable'
        env:
          KIND: ${{ inputs.build_kind }}
          NAME: ${{ inputs.artifact_name }}
          PREFIX: ${{ steps.s3.outputs.prefix }}
        run: |
          set -euo pipefail
          CDN_BASE="https://downloads.mindshub.ai"
          MANIFEST_NAME=$([ "$KIND" = "prod" ] && echo latest.json || echo staging.json)
          MANIFEST_URL="${CDN_BASE}/${PREFIX}/${MANIFEST_NAME}"
          LOCAL_SHA=$(sha256sum "out/${NAME}" | awk '{print $1}')

          fail() { echo "::error::$1"; exit 1; }
          field() {
            node -e 'const m = require("./manifest-live.json"); process.stdout.write(String(m[process.argv[1]] ?? ""))' "$1"
          }

          # A newly created key can be shadowed by an edge that cached the 404
          # for it moments earlier, so give it five minutes.
          RESOLVED=""
          for _ in $(seq 1 30); do
            if curl -fsS "$MANIFEST_URL" -o manifest-live.json \
              && node -e 'require("./manifest-live.json")' >/dev/null 2>&1; then
              RESOLVED=yes
              break
            fi
            sleep 10
          done
          if [ -z "$RESOLVED" ]; then
            curl -sS -D - "$MANIFEST_URL" -o /dev/null | head -20 || true
            fail "${MANIFEST_URL} did not serve JSON within 300s, so the manifest most likely never uploaded."
          fi

          for KEY in version key url size_bytes sha256 published_at; do
            [ -n "$(field "$KEY")" ] || fail "manifest field '${KEY}' is missing or empty"
          done

          MANIFEST_SHA=$(field sha256)
          INSTALLER_URL=$(field url)
          [ "$MANIFEST_SHA" = "$LOCAL_SHA" ] \
            || fail "manifest sha256 does not match the installer this release built (manifest=${MANIFEST_SHA} built=${LOCAL_SHA})"

          HEADERS=$(curl -fsSI "$INSTALLER_URL")
          grep -qiE '^cache-control: *public, *max-age=31536000, *immutable' <<<"$HEADERS" \
            || fail "${INSTALLER_URL} is not served as immutable: $(grep -i '^cache-control' <<<"$HEADERS" || echo 'no cache-control header')"
          grep -qiF "content-disposition: attachment; filename=\"${NAME}\"" <<<"$HEADERS" \
            || fail "${INSTALLER_URL} does not name the versioned file: $(grep -i '^content-disposition' <<<"$HEADERS" || echo 'no content-disposition header')"
          ETAG=$(grep -i '^etag:' <<<"$HEADERS" | tr -d '\r' | awk '{print $2}')

          # An interrupted download resumes by replaying its validator. If this
          # answers 200 the client gets the whole body again instead of the tail.
          RANGE_HEADERS=$(curl -sS -D - -o /dev/null -r 0-1023 -H "If-Range: ${ETAG}" "$INSTALLER_URL")
          RANGE_STATUS=$(head -1 <<<"$RANGE_HEADERS" | awk '{print $2}')
          RANGE_ETAG=$(grep -i '^etag:' <<<"$RANGE_HEADERS" | tr -d '\r' | awk '{print $2}')
          [ "$RANGE_STATUS" = "206" ] \
            || fail "${INSTALLER_URL} answered ${RANGE_STATUS} to a Range request, so an interrupted download cannot resume"
          [ "$RANGE_ETAG" = "$ETAG" ] \
            || fail "ETag moved between the HEAD and the Range request (${ETAG} then ${RANGE_ETAG})"

          {
            echo ""
            echo "### Public download manifest"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Manifest | ${MANIFEST_URL} |"
            echo "| Version | \`$(field version)\` |"
            echo "| Installer | ${INSTALLER_URL} |"
            echo "| Size | $(field size_bytes) bytes |"
            echo "| sha256 | \`${MANIFEST_SHA}\` |"
            echo "| Resumable | ✅ Range returned 206 with a stable ETag |"
          } >> "$GITHUB_STEP_SUMMARY"
