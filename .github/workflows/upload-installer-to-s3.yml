name: Upload installer to S3

on:
  workflow_call:
    inputs:
      platform:
        description: mac | windows | linux-amd64 | linux-arm64
        required: true
        type: string
      build_kind:
        description: preview | stable | prod
        required: true
        type: string
      artifact_name:
        description: Artifact name produced by the build workflow (also the final file name)
        required: true
        type: string
    outputs:
      download_url:
        description: >-
          Public CloudFront URL of the uploaded installer. Exposed so the calling
          pipeline can put it in front of a reviewer — the job summary is only
          found by someone who already went looking.
        value: ${{ jobs.upload.outputs.download_url }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  upload:
    runs-on: mdb-prod
    outputs:
      download_url: ${{ steps.s3.outputs.download_url }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: out

      - name: Validate Windows signing report before upload
        if: inputs.platform == 'windows'
        env:
          # Public Authenticode publisher CN of our installers (SSL.com EV cert).
          # Override via repo variable if the cert's subject ever changes.
          EXPECTED_PUBLISHER_CN: ${{ vars.WINDOWS_PUBLISHER_CN }}
        run: |
          set -euo pipefail
          REPORT_JSON="out/signing-report/installer-signature-report.json"
          if [ ! -f "$REPORT_JSON" ]; then
            echo "::error::Missing signing report: $REPORT_JSON"
            ls -la out || true
            exit 1
          fi
          # shellcheck disable=SC2016  # the JS below must NOT be shell-expanded
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const r = JSON.parse(fs.readFileSync(p, "utf8"));
            const required = ["status", "signerSubject", "timestampSubject", "sha256"];
            for (const k of required) {
              if (!r[k]) {
                console.error(`::error::signing-report missing field: ${k}`);
                process.exit(1);
              }
            }
            if (r.status !== "Valid") {
              console.error(`::error::Invalid signature status: ${r.status} (${r.statusMessage || ""})`);
              process.exit(1);
            }
            // Pin WHO signed it: a Valid signature from the wrong cert must not
            // publish. Match the CN token (comma-quoting varies by host).
            const expected = (process.env.EXPECTED_PUBLISHER_CN || "Mindsdb, Inc.").trim();
            const token = expected.split(",")[0].trim();
            const esc = token.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            if (!new RegExp("CN=\\s*\"?" + esc, "i").test(r.signerSubject)) {
              console.error(`::error::signer CN does not match expected publisher "${token}": ${r.signerSubject}`);
              process.exit(1);
            }
            console.log(`Windows signing report OK: ${r.file} signer=${r.signerSubject} sha256=${r.sha256}`);
          ' "$REPORT_JSON"

      - name: Upload to S3
        id: s3
        env:
          PLATFORM: ${{ inputs.platform }}
          KIND: ${{ inputs.build_kind }}
          NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          BUCKET="anton-installer"
          PREFIX="mindshub-cowork/${PLATFORM}"
          EXT="${NAME##*.}"
          SRC="out/${NAME}"

          if [ ! -f "$SRC" ]; then
            echo "::error::Expected file $SRC not found in downloaded artifact"
            ls -la out || true
            exit 1
          fi
          LOCAL_SHA=$(sha256sum "$SRC" | awk '{print $1}')

          REGION=$(aws s3api get-bucket-location --bucket "$BUCKET" --query LocationConstraint --output text 2>/dev/null || echo "")
          if [ -z "$REGION" ] || [ "$REGION" = "None" ] || [ "$REGION" = "null" ]; then
            REGION="us-east-1"
          fi
          HTTPS_BASE="https://${BUCKET}.s3.${REGION}.amazonaws.com"
          CDN_BASE="https://downloads.mindshub.ai"

          UPLOADED_KEYS=()

          upload() {
            local src="$1" key="$2"
            aws s3 cp "$src" "s3://${BUCKET}/${key}"
            UPLOADED_KEYS+=("$key")
          }

          case "$KIND" in
            preview)
              upload "$SRC" "${PREFIX}/previews/${NAME}"
              ;;
            stable)
              upload "$SRC" "${PREFIX}/snapshots/${NAME}"
              upload "$SRC" "${PREFIX}/mindshub-cowork-staging.${EXT}"
              ;;
            prod)
              upload "$SRC" "${PREFIX}/${NAME}"
              upload "$SRC" "${PREFIX}/mindshub-cowork-latest.${EXT}"
              ;;
            *)
              echo "::error::Unknown build_kind: $KIND"
              exit 1
              ;;
          esac

          echo ""
          echo "Uploaded ${#UPLOADED_KEYS[@]} object(s) to s3://${BUCKET} (region: ${REGION})"
          echo ""
          {
            echo "### Installer uploaded to S3"
            echo ""
            echo "- **Platform**: \`${PLATFORM}\`"
            echo "- **Build kind**: \`${KIND}\`"
            echo "- **Bucket**: \`${BUCKET}\` (\`${REGION}\`)"
            echo ""
            echo "| S3 URI | Object URL | Public download URL |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for KEY in "${UPLOADED_KEYS[@]}"; do
            S3_URI="s3://${BUCKET}/${KEY}"
            OBJECT_URL="${HTTPS_BASE}/${KEY}"
            # CloudFront (downloads.mindshub.ai) fronts the bucket root with no
            # path rewriting, so the public URL preserves the full object key.
            CDN_URL="${CDN_BASE}/${KEY}"
            echo "  ${S3_URI}"
            echo "  ${OBJECT_URL}"
            echo "  ${CDN_URL}"
            echo "| \`${S3_URI}\` | ${OBJECT_URL} | ${CDN_URL} |" >> "$GITHUB_STEP_SUMMARY"

            TMP_FILE="$(mktemp)"
            aws s3 cp "${S3_URI}" "$TMP_FILE" >/dev/null
            REMOTE_SHA=$(sha256sum "$TMP_FILE" | awk '{print $1}')
            rm -f "$TMP_FILE"
            if [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
              echo "::error::SHA256 mismatch for ${S3_URI}. local=${LOCAL_SHA} remote=${REMOTE_SHA}"
              exit 1
            fi
            echo "| \`${S3_URI}\` | ✅ sha256 verified (\`${REMOTE_SHA}\`) | ${CDN_URL} |" >> "$GITHUB_STEP_SUMMARY"
          done

          for KEY in "${UPLOADED_KEYS[@]}"; do
            case "$KEY" in
              *"${NAME}") echo "download_url=${CDN_BASE}/${KEY}" >> "$GITHUB_OUTPUT" ;;
            esac
          done

          {
            echo ""
            echo "### Public download URLs"
            echo ""
            echo "These installers are served via CloudFront at https://downloads.mindshub.ai (see \`terraform/newprod/us-east-1/anton/cloudfront.tf\`):"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for KEY in "${UPLOADED_KEYS[@]}"; do
            echo "- ${CDN_BASE}/${KEY}" >> "$GITHUB_STEP_SUMMARY"
          done

      # electron-updater reads one mutable channel manifest that references an
      # immutable signed payload. Publish payload/blockmap first and latest*.yml
      # last so clients can never observe metadata for bytes that do not exist.
      - name: Publish shell updater feed
        # linux ships no electron-updater feed — a .deb install updates via
        # apt/dpkg, not the Squirrel-style feed mac/windows use — so skip this
        # step for linux platforms rather than hitting the "Unknown updater
        # platform" branch below and failing the upload.
        if: >-
          (inputs.build_kind == 'prod' || inputs.build_kind == 'stable')
          && (inputs.platform == 'mac' || inputs.platform == 'windows')
        env:
          PLATFORM: ${{ inputs.platform }}
          KIND: ${{ inputs.build_kind }}
          NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          BUCKET="anton-installer"
          PREFIX="mindshub-cowork/updates/${KIND}/${PLATFORM}"
          CDN_BASE="https://downloads.mindshub.ai"

          case "$PLATFORM" in
            mac)
              PAYLOAD=$(find out/updater -maxdepth 1 -type f -name '*.zip' -print -quit)
              METADATA="out/updater/latest-mac.yml"
              ;;
            windows)
              PAYLOAD="out/${NAME}"
              METADATA="out/updater/latest.yml"
              ;;
            *)
              echo "::error::Unknown updater platform: $PLATFORM"
              exit 1
              ;;
          esac

          test -n "$PAYLOAD"
          test -f "$PAYLOAD"
          test -f "$METADATA"
          PAYLOAD_NAME=$(basename "$PAYLOAD")
          PAYLOAD_KEY="${PREFIX}/${PAYLOAD_NAME}"

          # Immutable means immutable: never overwrite an existing key. A signed
          # payload's bytes differ on every re-run (signature timestamp), so
          # overwriting would let CloudFront keep serving the old cached bytes
          # under a URL whose fresh latest.yml now names a new hash — bricking
          # verification until the CDN TTL expires. Create-only: if the key
          # already holds identical bytes, skip; if it holds DIFFERENT bytes,
          # fail loudly (bump the version instead of re-publishing).
          upload_immutable() {
            local src="$1" key="$2"
            local expected actual tmp
            expected=$(sha256sum "$src" | awk '{print $1}')
            if aws s3api head-object --bucket "$BUCKET" --key "$key" >/dev/null 2>&1; then
              tmp=$(mktemp)
              aws s3 cp "s3://${BUCKET}/${key}" "$tmp" >/dev/null
              actual=$(sha256sum "$tmp" | awk '{print $1}')
              rm -f "$tmp"
              if [ "$expected" != "$actual" ]; then
                echo "::error::Refusing to overwrite immutable key ${key}: existing bytes differ (existing=${actual} new=${expected}). Bump the version instead of re-publishing."
                exit 1
              fi
              echo "Immutable key ${key} already present and byte-identical — skipping re-upload."
              return 0
            fi
            aws s3 cp "$src" "s3://${BUCKET}/${key}" \
              --cache-control "public,max-age=31536000,immutable"
            tmp=$(mktemp)
            aws s3 cp "s3://${BUCKET}/${key}" "$tmp" >/dev/null
            actual=$(sha256sum "$tmp" | awk '{print $1}')
            rm -f "$tmp"
            test "$expected" = "$actual"
          }

          # 1. Immutable signed payload.
          upload_immutable "$PAYLOAD" "$PAYLOAD_KEY"

          # 2. Optional differential-download blockmap, generated from the
          # final payload bytes (post-sign on Windows).
          BLOCKMAP="${PAYLOAD}.blockmap"
          if [ ! -f "$BLOCKMAP" ]; then
            BLOCKMAP="out/updater/${PAYLOAD_NAME}.blockmap"
          fi
          if [ -f "$BLOCKMAP" ]; then
            upload_immutable "$BLOCKMAP" "${PREFIX}/$(basename "$BLOCKMAP")"
          fi

          # 3. Mutable channel pointer, always last.
          METADATA_NAME=$(basename "$METADATA")
          aws s3 cp "$METADATA" "s3://${BUCKET}/${PREFIX}/${METADATA_NAME}" \
            --cache-control "no-cache,no-store,must-revalidate"

          # Verify the public CDN serves the exact payload BYTES, not just an
          # HTTP 200 — a stale CloudFront object under an immutable key would
          # pass a status check but fail client sha512 verification.
          PAYLOAD_SHA=$(sha256sum "$PAYLOAD" | awk '{print $1}')
          CDN_TMP=$(mktemp)
          curl -fsSL --retry 5 --retry-delay 2 \
            "${CDN_BASE}/${PAYLOAD_KEY}" -o "$CDN_TMP"
          CDN_SHA=$(sha256sum "$CDN_TMP" | awk '{print $1}')
          rm -f "$CDN_TMP"
          if [ "$CDN_SHA" != "$PAYLOAD_SHA" ]; then
            echo "::error::CDN payload hash mismatch for ${PAYLOAD_KEY} (cdn=${CDN_SHA} local=${PAYLOAD_SHA}). CloudFront may be serving a stale object; invalidate the path."
            exit 1
          fi
          # A query suffix avoids accepting an older cached channel manifest.
          curl -fsSL --retry 5 --retry-delay 2 \
            "${CDN_BASE}/${PREFIX}/${METADATA_NAME}?run=${GITHUB_RUN_ID}" -o /dev/null

          {
            echo ""
            echo "### Shell updater feed"
            echo ""
            echo "- Payload: ${CDN_BASE}/${PAYLOAD_KEY}"
            echo "- Metadata: ${CDN_BASE}/${PREFIX}/${METADATA_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
