name: Prod - Build and Deploy on push to main

# One release pipeline builds tests, SPA, CalVer installers, and the matching OTA bundle.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  run-unit-tests:
    uses: ./.github/workflows/tests-unit.yml
    secrets: inherit

  build-deploy:
    # Match argocd-envs' production tag fallback.
    needs: [run-unit-tests]
    permissions:
      contents: read
    uses: ./.github/workflows/build-deploy.yml
    with:
      build-environment: production
      build-runner: mdb-prod
    secrets: inherit

  auto-release:
    # Use one CalVer tag for installers and OTA.
    needs: [run-unit-tests]
    permissions:
      contents: write # tag push + release creation
    uses: mindsdb/github-actions/.github/workflows/calver-release.yml@main
    with:
      calver-major: "2"
      runs-on: ubuntu-latest
    secrets: inherit

  build-installers:
    needs: [auto-release]
    uses: ./.github/workflows/build-installers.yml
    with:
      # Use the stable PyPI release stream for fresh production installs.
      build_kind: prod
      minds_api_url: https://api.mindshub.ai
      app_version: ${{ needs.auto-release.outputs.tag }}
    secrets: inherit

  release-smoke:
    # Check only this release's prod version against the public CDN; staging manifests belong to another pipeline.
    needs: [auto-release, build-installers]
    uses: ./.github/workflows/release-smoke.yml
    with:
      channels: prod
      version: ${{ needs.auto-release.outputs.version }}

  publish-ui:
    # Publish the UI manifest only after installers exist, or it would advertise an unavailable reinstall.
    needs: [auto-release, build-installers]
    # Grant publish-ui's declared permissions or GitHub rejects the entire run at load.
    permissions:
      contents: write
    uses: ./.github/workflows/publish-ui.yml
    with:
      version: ${{ needs.auto-release.outputs.version }}
      shell_version: ${{ needs.auto-release.outputs.version }}
    secrets: inherit

  notify:
    # Report aggregate failure/recovery; cancelled runs stay quiet.
    # pipeline-watchdog covers startup_failure runs where no notification job can start.
    needs:
      [run-unit-tests, build-deploy, auto-release, build-installers, release-smoke, publish-ui]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      actions: read # the prior-run lookup behind the recovery message
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "prod release + installers"
      status: ${{ contains(needs.*.result, 'failure') && 'failed' || 'recovered' }}
      runs-on: ubuntu-latest
    secrets: inherit
