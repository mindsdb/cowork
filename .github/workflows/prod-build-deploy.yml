name: Prod - Build and Deploy on push to main

# THE prod pipeline. Unit tests, the web SPA image, the CalVer release, both signed
# installers cut from that release, and the OTA UI bundle — one run tree. It used to
# be three runs on the same push (this file, tests-unit.yml, and release.yml), which
# is how a release could be tagged in one run while another quietly failed.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Cancel any existing runs of this workflow on the same branch/pr
# We always want to build/deploy/test a new commit over an older one
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  run-unit-tests:
    uses: ./.github/workflows/tests-unit.yml
    secrets: inherit

  build-deploy:
    # A production-<sha> image so the argocd-envs parent chart's
    # `tags.cowork: production` fallback resolves, and for static prod rollout.
    needs: [run-unit-tests]
    permissions:
      contents: read
    uses: ./.github/workflows/build-deploy.yml
    with:
      build-environment: production
    secrets: inherit

  auto-release:
    # The CalVer tag, which the installers and the UI bundle below are both cut
    # from — so an OTA user never sees a UI version that differs from the app.
    needs: [run-unit-tests]
    permissions:
      contents: write # tag push + release creation
    uses: mindsdb/github-actions/.github/workflows/calver-release.yml@main
    with:
      calver-major: "2"
      runs-on: ubuntu-latest
    secrets: inherit

  build-installers:
    needs: [auto-release]
    uses: ./.github/workflows/build-installers.yml
    with:
      # prod -> the PyPI stable stream: immutable, versioned, yankable, and no
      # git or Xcode on first run.
      build_kind: prod
      minds_api_url: https://api.mindshub.ai
      app_version: ${{ needs.auto-release.outputs.tag }}
    secrets: inherit

  release-smoke:
    # The independent second opinion on the release. The upload job verifies its
    # own work from inside the pipeline; this one downloads the result the way a
    # user does, in a real browser, from the public CDN.
    #
    # `prod` only, and the version this run tagged. The stable channel's
    # manifest comes from a push to `staging` and has nothing to say about this
    # release, so asserting it here would fail a release that worked. The
    # version is what makes the check about THIS release rather than about
    # whichever manifest happens to be published.
    needs: [auto-release, build-installers]
    uses: ./.github/workflows/release-smoke.yml
    with:
      channels: prod
      version: ${{ needs.auto-release.outputs.version }}

  publish-ui:
    # Waits on build-installers, not just the tag: the manifest names that
    # installer as the latest shell version, so publishing before the installer
    # exists — or after its build failed — would advertise a reinstall the
    # download URL can't serve.
    needs: [auto-release, build-installers]
    # `contents: write` because publish-ui.yml declares it at workflow level (it
    # pushes the bundle and updates the release). Without this the whole prod run
    # is rejected at file load as a startup_failure — the permission gate caught
    # exactly that before this ever ran.
    permissions:
      contents: write
    uses: ./.github/workflows/publish-ui.yml
    with:
      version: ${{ needs.auto-release.outputs.version }}
      # The prod installer build-installers just shipped, at the same CalVer as
      # the installer and the UI bundle.
      shell_version: ${{ needs.auto-release.outputs.version }}
    secrets: inherit

  notify:
    # Alert the eng channel if ANY job in the prod pipeline fails — the tag, the
    # image, the installers, the public-download smoke, or the UI publish. A
    # called workflow reports failure when any job inside it failed, so the
    # entries below cover the whole graph.
    # One job covers both outcomes: a `uses:` job cannot branch on status, so
    # the aggregate result picks the failed or recovered message, and a
    # cancelled run stays silent.
    #
    # It cannot cover a run that never started (`startup_failure`, zero jobs) —
    # there is no job to put it in. pipeline-watchdog.yml covers that from outside.
    needs:
      [run-unit-tests, build-deploy, auto-release, build-installers, release-smoke, publish-ui]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      actions: read # the prior-run lookup behind the recovery message
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "prod release + installers"
      status: ${{ contains(needs.*.result, 'failure') && 'failed' || 'recovered' }}
      runs-on: ubuntu-latest
    secrets: inherit
