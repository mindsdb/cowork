# Build (and upload) the desktop installers for all platforms, defined once.
#
# The three per-event installer workflows each wired up the same shape of jobs —
# build-<platform>, upload-<platform> — differing only in `build_kind`, the API
# host, and whether a PR label gated them. That is a lot of boilerplate
# expressing three inputs.
#
# mac, windows, and linux stay SEPARATE called workflows rather than a matrix,
# because they genuinely differ below the surface: different runner OS (linux
# additionally needs two native runners, one per arch, since keytar can't
# cross-compile), different signing material, different notarisation and EV
# steps — linux ships unsigned. A matrix would have to branch on
# `matrix.platform` in every step, which is the duplication moved rather than
# removed. What is shared is the shape — build, then upload, then hand back a URL —
# and that is what lives here.
#
# Every platform is independently switchable — macOS and Windows because a pull
# request builds them only when a signing-cost label asks for them, while a
# staging or prod run builds both; linux_amd64/linux_arm64 because they run as
# separate native runners regardless. Linux is unsigned and comparatively cheap,
# so both default to on everywhere.

name: Build installers

on:
  workflow_call:
    inputs:
      build_kind:
        description: "preview (PR) | stable (staging rc stream) | prod"
        type: string
        required: true
      minds_api_url:
        description: >-
          Which MindsHub environment the app talks to. Must be stated: it feeds
          BOTH halves of the app (main bakes it via gen-build-channel, Vite bakes
          it for the renderer), and only main knows the build kind — so when it is
          absent main falls back on build_kind while the renderer, which cannot see
          the build kind, falls back to prod. The app then runs Keycloak against one
          environment and the session against the other, and login can never succeed.
        type: string
        required: true
      server_ref:
        description: >-
          cowork-server branch to install for this build. A non-empty ref selects
          the git channel for fresh installs as well as updates, keeping feature
          UI and backend routes on the same revision line.
        type: string
        default: ""
      anton_ref:
        description: >-
          Optional anton branch/tag. Leave empty to use the dependency pinned by
          cowork-server; set it only when that agent branch actually exists.
        type: string
        default: ""
      server_channel:
        description: >-
          Optional explicit git or pypi override. Empty lets server_ref select
          git; release callers set pypi when their ref is updater metadata only.
        type: string
        default: ""
      app_version:
        description: "Explicit version, for a prod build cut from a release tag."
        type: string
        default: ""
      macos:
        description: "Build and upload the macOS .pkg"
        type: boolean
        default: true
      windows:
        description: "Build and upload the Windows .exe"
        type: boolean
        default: true
      linux_amd64:
        description: "Build and upload the Linux .deb (amd64)"
        type: boolean
        default: true
      linux_arm64:
        description: "Build and upload the Linux .deb (arm64)"
        type: boolean
        default: true
    outputs:
      macos_download_url:
        description: "Public CloudFront URL of the uploaded .pkg, empty when not built"
        value: ${{ jobs.upload-macos.outputs.download_url }}
      windows_download_url:
        description: "Public CloudFront URL of the uploaded .exe, empty when not built"
        value: ${{ jobs.upload-windows.outputs.download_url }}
      linux_amd64_download_url:
        description: "Public CloudFront URL of the uploaded amd64 .deb, empty when not built"
        value: ${{ jobs.upload-linux-amd64.outputs.download_url }}
      linux_arm64_download_url:
        description: "Public CloudFront URL of the uploaded arm64 .deb, empty when not built"
        value: ${{ jobs.upload-linux-arm64.outputs.download_url }}

jobs:
  build-macos:
    if: inputs.macos
    uses: ./.github/workflows/build-macos-pkg.yml
    with:
      build_kind: ${{ inputs.build_kind }}
      minds_api_url: ${{ inputs.minds_api_url }}
      server_ref: ${{ inputs.server_ref }}
      anton_ref: ${{ inputs.anton_ref }}
      server_channel: ${{ inputs.server_channel }}
      app_version: ${{ inputs.app_version }}
    secrets: inherit

  upload-macos:
    needs: build-macos
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: mac
      build_kind: ${{ inputs.build_kind }}
      artifact_name: ${{ needs.build-macos.outputs.artifact_name }}
    secrets: inherit

  build-windows:
    if: inputs.windows
    uses: ./.github/workflows/build-windows-installer.yml
    with:
      build_kind: ${{ inputs.build_kind }}
      minds_api_url: ${{ inputs.minds_api_url }}
      server_ref: ${{ inputs.server_ref }}
      anton_ref: ${{ inputs.anton_ref }}
      server_channel: ${{ inputs.server_channel }}
      app_version: ${{ inputs.app_version }}
    secrets: inherit

  upload-windows:
    needs: build-windows
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: windows
      build_kind: ${{ inputs.build_kind }}
      artifact_name: ${{ needs.build-windows.outputs.artifact_name }}
    secrets: inherit

  build-linux-amd64:
    if: inputs.linux_amd64
    uses: ./.github/workflows/build-linux-deb.yml
    with:
      arch: amd64
      build_kind: ${{ inputs.build_kind }}
      minds_api_url: ${{ inputs.minds_api_url }}
      server_ref: ${{ inputs.server_ref }}
      anton_ref: ${{ inputs.anton_ref }}
      server_channel: ${{ inputs.server_channel }}
      app_version: ${{ inputs.app_version }}
    secrets: inherit

  upload-linux-amd64:
    needs: build-linux-amd64
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: linux-amd64
      build_kind: ${{ inputs.build_kind }}
      artifact_name: ${{ needs.build-linux-amd64.outputs.artifact_name }}
    secrets: inherit

  build-linux-arm64:
    if: inputs.linux_arm64
    uses: ./.github/workflows/build-linux-deb.yml
    with:
      arch: arm64
      build_kind: ${{ inputs.build_kind }}
      minds_api_url: ${{ inputs.minds_api_url }}
      server_ref: ${{ inputs.server_ref }}
      anton_ref: ${{ inputs.anton_ref }}
      server_channel: ${{ inputs.server_channel }}
      app_version: ${{ inputs.app_version }}
    secrets: inherit

  upload-linux-arm64:
    needs: build-linux-arm64
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: linux-arm64
      build_kind: ${{ inputs.build_kind }}
      artifact_name: ${{ needs.build-linux-arm64.outputs.artifact_name }}
    secrets: inherit
