# Build one environment-independent SPA image; service URLs derive from page origin at runtime.
# Only production receives analytics credentials; stamp the deployed commit as app_version.
# Reusable workflow permissions must be granted by EVERY caller or GitHub rejects the entire run at load.
# Keep PR comments and their permissions in the PR caller.

name: Build and Deploy

on:
  workflow_call:
    inputs:
      build-environment:
        description: "Image tag prefix in ECR (development | staging | production)"
        type: string
        required: true
      build-runner:
        description: "Runner label for the build and scan"
        type: string
        default: mdb-dev
      pr-environment:
        description: "Run the per-PR environment rollout"
        type: boolean
        default: false
    outputs:
      pr-env-deployed:
        description: >-
          "true" only when the per-PR environment actually rolled out. The pipeline
          succeeding does not mean one exists: without the `deploy` label the
          rollout is skipped and everything else still passes, so a caller keying
          off the pipeline result advertises a URL for an environment nobody
          created.
        value: ${{ jobs.deploy-pr-env.outputs.deployed }}

defaults:
  run:
    shell: bash

jobs:
  build:
    # Buildkit is available on the dev runner.
    runs-on: mdb-dev
    outputs:
      image: ${{ steps.build.outputs.image }}
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: mindsdb/github-actions/setup-env@main
      - id: build
        uses: mindsdb/github-actions/build-push-ecr@main
        with:
          module-name: ${{ env.CI_REPOSITORY_SLUG }}
          # Gate analytics to production so staging/PR traffic cannot pollute production metrics.
          # Pass the deployed commit because the Docker build has no .git for version discovery.
          extra-build-args: >-
            -f Dockerfile.frontend
            --build-arg VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN=${{ inputs.build-environment == 'production' && secrets.VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN || '' }}
            --build-arg VITE_APP_VERSION=${{ env.SLUG }}
          build-for-environment: ${{ inputs.build-environment }}

  scan:
    runs-on: mdb-dev
    needs: [build]
    name: Scan Minds Image
    steps:
      - uses: actions/checkout@v4
      - uses: mindsdb/github-actions/snyk-docker-scan@main
        with:
          image: ${{ needs.build.outputs.image }}
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          # Scan Dockerfile.frontend so findings match the image built here.
          dockerfile: Dockerfile.frontend
          # Keep scans advisory for PRs and blocking for deploy branches.
          allow-vulns: ${{ inputs.pr-environment && 'true' || '' }}

  deploy-pr-env:
    runs-on: ${{ inputs.build-runner }}
    needs: [build]
    if: inputs.pr-environment && contains(github.event.pull_request.labels.*.name, 'deploy')
    environment:
      name: pr-cowork-${{ github.event.pull_request.number }}
      url: https://pr-cowork-${{ github.event.pull_request.number }}.dev.mindshub.ai
    outputs:
      deployed: ${{ steps.rollout.outputs.deployed }}
    steps:
      - uses: mindsdb/github-actions/argocd-pr-env-deploy@main
        with:
          argocd-token: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          gh-token: ${{ secrets.GH_PULL_REQUEST_READ_TOKEN }}
      - name: Record that the environment is up
        id: rollout
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ${{ inputs.build-runner }}
    # Wait for the blocking scan before deploying.
    needs: [build, scan]
    # Only long-lived staging/prod environments use this rollout; PR environments deploy separately.
    if: inputs.build-environment == 'staging' || inputs.build-environment == 'production'
    env:
      # Map image tag prefix production to Helm environment prod.
      DEPLOY_ENV: ${{ inputs.build-environment == 'production' && 'prod' || 'staging' }}
    environment:
      # environment resolves before job env exists, so spell out the inputs expression.
      name: ${{ inputs.build-environment == 'production' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: mindsdb/github-actions/setup-env@main
      - uses: DevOps-Nirvana/aws-helm-multi-deploy-nodocker@v8
        with:
          environment-slug: ${{ env.DEPLOY_ENV }}
          k8s-namespace: ${{ env.DEPLOY_ENV }}
          image-tag: ${{ inputs.build-environment }}-${{ env.SLUG }}
          timeout: 600s
          wait: "true"
      # Use rollout status: a pod selector also matches terminating old replicas, whose disappearance fails kubectl wait.
      - run: kubectl -n "$DEPLOY_ENV" rollout status deployment/cowork-frontend --timeout=10m
