# The cowork web SPA image build, defined once.
#
# The three per-env workflows each carried the same build and scan, differing only
# in the tag prefix, plus a per-PR environment rollout on the dev one. The static
# staging/prod Helm rollout lives here too, as one `deploy` job that maps the
# build environment to the target rather than two near-identical copies.
#
# The SPA is env-agnostic: it derives every MindsHub service URL from the page
# origin at runtime (src/renderer/lib/mindsUrls.ts), so one image serves every dev
# namespace and every PR env with no VITE build args for service URLs — the two
# exceptions below are build identity, not per-env config: the PostHog token,
# gated to production so staging and PR-env builds ship analytics-disabled, and
# VITE_APP_VERSION, the deployed commit stamped onto every analytics event as
# app_version (the in-container build drops .git, so without it app_version falls
# back to a stale package.json version). `-f Dockerfile.frontend` selects the
# SPA build rather than the all-in-one ./Dockerfile.
#
# ON PERMISSIONS. A called workflow can never exceed its caller's grant, and that
# cap is checked when the workflow FILE IS LOADED, not when a job runs. A job here
# naming a scope any one caller does not grant rejects that caller's whole run as a
# `startup_failure` with zero jobs, and with no job in the run no notify job can
# report it. So: declare only what EVERY caller grants. Nothing here declares a PR
# scope — the environment comment lives in the pull-request caller, where the grant
# belongs. The shared `workflow-lint.yml` gate checks this on every PR.

name: Build and Deploy

on:
  workflow_call:
    inputs:
      build-environment:
        description: "Image tag prefix in ECR (development | staging | production)"
        type: string
        required: true
      build-runner:
        description: "Runner label for the Helm deploy (prod); the build, scan and PR environment deploy run on ubuntu-latest"
        type: string
        default: mdb-dev
      pr-environment:
        description: "Run the per-PR environment rollout"
        type: boolean
        default: false
      deploy-through-argocd:
        description: >-
          Deploy by recording the build in mindsdb/argocd-state for Argo CD to
          sync (staging) instead of running Helm from the runner (prod).
        type: boolean
        default: false
    outputs:
      pr-env-deployed:
        description: >-
          "true" only when the per-PR environment actually rolled out. The pipeline
          succeeding does not mean one exists: without the `deploy` label the
          rollout is skipped and everything else still passes, so a caller keying
          off the pipeline result advertises a URL for an environment nobody
          created.
        value: ${{ jobs.deploy-pr-env.outputs.deployed }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token configure-aws-credentials exchanges for the ECR role.
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Assume the ECR push role
        # github-ecr-push from terraform's github-oidc stack, which every
        # mindsdb repository may assume.
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1
      - id: build
        uses: mindsdb/github-actions/build-image@main
        with:
          # The web SPA is the only image this repo pushes to ECR.
          module-name: mindsdb-cowork
          file: Dockerfile.frontend
          # Every desktop build workflow (build-linux-deb.yml, build-macos-pkg.yml,
          # build-windows-installer.yml, publish-ui.yml) passes this so `vite build`
          # bakes a real PostHog key; the web SPA never did, so `capture()`'s own
          # `if (!POSTHOG_KEY) return` silently no-ops every analytics event on
          # every deployed web build, including this repo's own chat_turn_failed.
          # Gated to production: this same job builds staging and every
          # `pr-cowork-<n>` image, and capture() stamps no environment property,
          # so an ungated token would mix staging/PR-env noise into the prod
          # chat_turn_failed series with no way to filter it back out. Non-prod
          # builds fall back to Dockerfile.frontend's empty ARG default, which
          # degrades to today's silent no-op rather than failing the build.
          # VITE_APP_VERSION stamps the deployed commit (the same value as the
          # image tag) as analytics app_version. The in-container build drops
          # .git, so vite.config.ts's git-describe step falls back to a stale
          # package.json version without it.
          build-args: |
            VITE_PLATFORM_UI=true
            VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN=${{ inputs.build-environment == 'production' && secrets.VITE_POSTHOG_MINDSHUB_MAIN_PROJECT_TOKEN || '' }}
            VITE_APP_VERSION=${{ github.sha }}
            VITE_BRAND_ENV=${{ inputs.build-environment }}
          build-for-environment: ${{ inputs.build-environment }}

  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [build]
    name: Scan Minds Image
    steps:
      - uses: actions/checkout@v4
      - name: Assume the ECR push role
        # The same role; it may also pull the image it pushed.
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1
      - uses: mindsdb/github-actions/snyk-docker-scan@main
        with:
          image: ${{ needs.build.outputs.image }}
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          # This workflow builds Dockerfile.frontend, not the action's default
          # ./Dockerfile — otherwise Snyk attributes findings to the wrong image.
          dockerfile: Dockerfile.frontend
          # Advisory on a PR, blocking on a deploy branch: an upstream CVE should
          # not stop someone iterating, and should stop a release.
          allow-vulns: ${{ inputs.pr-environment && 'true' || '' }}

  deploy-pr-env:
    # Records the PR's images in mindsdb/argocd-state, which the environment's
    # parent Application reads, then waits for the argocd/pr-env commit status
    # Argo CD sets once the environment is up. No cluster credential and no
    # `environment:` block: Argo CD creates the GitHub Deployment itself.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the ECR role, for the image-existence checks
      statuses: write # argocd/pr-env pending on the head commit
    needs: [build]
    if: inputs.pr-environment && contains(github.event.pull_request.labels.*.name, 'deploy')
    outputs:
      deployed: ${{ steps.rollout.outputs.deployed }}
    steps:
      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Mint a token for argocd-state
        id: release-train
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: mindsdb
          repositories: argocd-state
          permission-contents: write
      - uses: mindsdb/github-actions/argocd-pr-env-deploy@ci/pr-envs-state
        with:
          state-token: ${{ steps.release-train.outputs.token }}
          gh-token: ${{ secrets.GH_PULL_REQUEST_READ_TOKEN }}
      - name: Record that the environment is up
        id: rollout
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

  deploy:
    # The Helm deploy, from a runner with the cluster's credentials: prod.
    # staging goes through deploy-argocd below.
    runs-on: ${{ inputs.build-runner }}
    # `scan` too: it is blocking on a deploy branch (see `allow-vulns` above), so
    # needing only `build` would let a rollout run beside a failing scan.
    needs: [build, scan]
    # Only the two long-lived environments have a static rollout. A `development`
    # build is either a PR (handled by `deploy-pr-env`) or nothing.
    if: (inputs.build-environment == 'staging' || inputs.build-environment == 'production') && !inputs.deploy-through-argocd
    env:
      # `build-environment` names the image tag prefix (production); the Helm
      # chart and namespace name the environment (prod). One is not the other, so
      # map once here rather than at each use.
      DEPLOY_ENV: ${{ inputs.build-environment == 'production' && 'prod' || 'staging' }}
    environment:
      # Spelled out rather than `env.DEPLOY_ENV`: `environment` is resolved before
      # the job's `env` block exists, and only takes github/needs/strategy/matrix/
      # vars/inputs.
      name: ${{ inputs.build-environment == 'production' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: mindsdb/github-actions/setup-env@main
      - uses: DevOps-Nirvana/aws-helm-multi-deploy-nodocker@v8
        with:
          environment-slug: ${{ env.DEPLOY_ENV }}
          k8s-namespace: ${{ env.DEPLOY_ENV }}
          image-tag: ${{ inputs.build-environment }}-${{ env.SLUG }}
          timeout: 600s
          wait: "true"
      # rollout status, not `wait ... pod -l <selector>`: the selector also
      # matches the old ReplicaSet's terminating pods, and `wait` fails when one
      # disappears mid-wait even though the deploy succeeded.
      - run: kubectl -n "$DEPLOY_ENV" rollout status deployment/cowork-frontend --timeout=10m

  deploy-argocd:
    # The staging deploy. Records the commit and its image tag in
    # mindsdb/argocd-state, which Argo CD in newdev watches and syncs, then
    # waits for the argocd/staging/cowork-frontend commit status Argo CD sets once the sync
    # is healthy. No cluster credential, and no `environment:` block: Argo CD
    # creates the GitHub Deployment itself.
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: inputs.build-environment == 'staging' && inputs.deploy-through-argocd
    permissions:
      contents: read
      # write-env-state sets argocd/staging/cowork-frontend to pending on the commit; the
      # wait below reads it.
      statuses: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # A superseded run must not record an older commit over the newer one's.
      - name: Check this commit is still the branch tip
        id: freshness
        run: |
          set -euo pipefail
          tip="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::${GITHUB_SHA} is no longer the tip of ${GITHUB_REF_NAME} (now ${tip}). That commit's run deploys instead."
          fi
      - name: Mint a token for argocd-state
        id: release-train
        if: steps.freshness.outputs.superseded != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: mindsdb
          repositories: argocd-state
          permission-contents: write
      - uses: mindsdb/github-actions/write-env-state@main
        if: steps.freshness.outputs.superseded != 'true'
        with:
          env: staging
          service: cowork-frontend
          sha: ${{ github.sha }}
          tag: ${{ inputs.build-environment }}-${{ github.sha }}
          token: ${{ steps.release-train.outputs.token }}
      - name: Wait for Argo CD
        if: steps.freshness.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '.statuses[] | select(.context == "argocd/staging/cowork-frontend") | .state')"
            case "$state" in
              success) echo "Argo CD synced $GITHUB_SHA to staging"; exit 0 ;;
              failure|error) echo "::error::Argo CD reported $state for $GITHUB_SHA in staging: see the argocd/staging/cowork-frontend status on the commit"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Argo CD has not reported on $GITHUB_SHA in staging: see the argocd/staging/cowork-frontend status on the commit"
          exit 1
