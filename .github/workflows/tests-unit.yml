name: Tests (unit)

# Typecheck + unit/component tests + a real renderer build.
#
# `workflow_call` only. It used to carry its own `pull_request` and `push`
# triggers, which meant every PR and every merge produced a SECOND run tree
# beside the pipeline's — two places to look for "did this commit pass", and the
# second one is the one nobody looks at. Each pipeline now calls it, so the whole
# event lands in one run.
#
# Concurrency and the terminal failure alert both moved to the callers with it: a
# called workflow inherits the caller's event, so those belong where the trigger
# is, and a notify job here would double up with the pipeline's own.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  locked-server-install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Docker installer's uv version
        run: python -m pip install uv==0.7.22
      - name: Verify supplied locks, install ordering and real wheel enforcement
        run: |
          uv --version
          python -m unittest discover -s scripts -p 'test_install_locked_server*.py' -v

  release-server-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 22
      - name: Install the supported resolver and the fixture packaging and TLS libraries
        run: python -m pip install uv==0.7.22 packaging==26.0 cryptography==50.0.2
      - name: Verify release installs, rollback, controlled-index failures and download trust
        run: python -m unittest discover -s scripts -p test_install_release_server.py -v
      # pip, or any Windows HTTPS client, would download these roots again, so
      # the trim runs after every step that reaches PyPI or GitHub.
      - name: Remove the roots a fresh Windows downloads only on demand
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($store in 'Root', 'AuthRoot') {
            foreach ($root in 'D69B561148F01C77C54578C10926DF5B856976AD', 'CABD2A79A1076A31F21D253635CB039D4329A5E8') {
              $path = "Cert:\LocalMachine\$store\$root"
              if (Test-Path $path) { Remove-Item $path; "Removed $root from LocalMachine\$store" }
            }
          }
      - name: Verify real downloads on that store, without and with the runtime's roots
        if: runner.os == 'Windows'
        env:
          COWORK_PUBLIC_ROOTS: ${{ runner.temp }}\public-roots.pem
        run: |
          node -e "require('fs').writeFileSync(process.env.COWORK_PUBLIC_ROOTS, require('tls').rootCertificates.join('\n') + '\n')"
          python -m unittest discover -s scripts -p test_install_release_server.py -k WindowsStoreTests -v

  nginx-logging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install native nginx test dependencies
        run: sudo apt-get update && sudo apt-get install -y nginx gettext-base
      - name: Verify access, failure, privacy and shutdown behavior
        run: python3 scripts/test-nginx-logging.py

  spa-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SPA wrapper test dependencies
        run: python -m pip install fastapi==0.141.1 httpx==0.28.1
      - name: SPA wrapper route tests
        run: python -m unittest discover -s scripts -p test_spa_wrapper.py -v

  test:
    runs-on: ubuntu-latest # unit/component only — no native/Electron dep
    timeout-minutes: 15
    env:
      COWORK_SERVER_CHANNEL: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry # self-heal transient install flakes
        with:
          command: npm ci
      - name: Typecheck (main + renderer)
        run: npm run typecheck
      - name: Published macOS setup smoke contract
        run: npm run test:macos-setup-contract
      - name: Cowork purity guard (no direct bridge access)
        run: npm run check:cowork-purity
      - name: Unit + component tests + coverage
        run: npm run test:coverage
      - name: Coverage summary
        # Renders the json-summary into the run's Summary tab. No third-party
        # action, no extra permissions (qa.md §7 supply-chain stance).
        if: always()
        run: |
          node -e "
          const s = require('./coverage/coverage-summary.json');
          const rows = Object.entries(s)
            .filter(([f]) => f !== 'total')
            .map(([f, d]) => \`| \${f.replace(process.cwd() + '/', '')} | \${d.statements.pct}% | \${d.branches.pct}% | \${d.lines.pct}% |\`);
          const t = s.total;
          console.log('## Coverage');
          console.log('| File | Stmts | Branch | Lines |');
          console.log('|---|---|---|---|');
          console.log(\`| **total** | **\${t.statements.pct}%** | **\${t.branches.pct}%** | **\${t.lines.pct}%** |\`);
          rows.forEach(r => console.log(r));
          " >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry
        with:
          command: npm ci
      - run: npm run build:renderer
