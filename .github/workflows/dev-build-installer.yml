name: Dev - Build installer on PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  build-macos:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'signed-macos-pkg') &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build-macos-pkg.yml
    with:
      build_kind: preview
      # Channel is derived from build_kind in build-macos-pkg.yml (preview →
      # PyPI rc stream, no git). server_ref is kept for machines that already
      # carry a GIT install of cowork-server (the updater is source-aware); a
      # dev who needs a specific backend branch overrides with
      # COWORK_SERVER_CHANNEL=git + COWORK_SERVER_REF at launch.
      server_ref: staging
      # Must be stated, not left to the default. This one value feeds BOTH
      # halves of the app (gen-build-channel bakes it for main, Vite bakes it
      # for the renderer), and only main knows the build kind — so when it is
      # absent main falls back to staging on the strength of build_kind while
      # the renderer, which cannot see the build kind, falls back to prod. The
      # app then runs Keycloak against one environment and the session against
      # the other, and login can never succeed. A PR build tests staging.
      minds_api_url: https://api.staging.mindshub.ai
    secrets: inherit

  upload-macos:
    needs: build-macos
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: mac
      build_kind: preview
      artifact_name: ${{ needs.build-macos.outputs.artifact_name }}

  build-windows:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'signed-windows-ev') &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build-windows-installer.yml
    with:
      build_kind: preview
      # See build-macos above: channel derived from build_kind (preview →
      # PyPI rc stream, no git). server_ref kept for existing git installs.
      server_ref: staging
      # See build-macos above: stating this keeps main and the renderer on one
      # environment. Leaving it to the default splits them and breaks login.
      minds_api_url: https://api.staging.mindshub.ai
    secrets: inherit

  upload-windows:
    needs: build-windows
    uses: ./.github/workflows/upload-installer-to-s3.yml
    with:
      platform: windows
      build_kind: preview
      artifact_name: ${{ needs.build-windows.outputs.artifact_name }}
