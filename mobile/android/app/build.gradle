apply plugin: 'com.android.application'

// Versioning (ENG-4023): versionName is mobile/package.json's version, the same
// value the iOS build and the MindsHubCowork-Android/<version> user agent use.
// versionCode is the CI run number: COWORK_BUILD_NUMBER env, or
// -PcoworkBuildNumber=<n>, default 1 for local builds.
def coworkVersionName = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def coworkVersionCode = (System.getenv('COWORK_BUILD_NUMBER') ?: project.findProperty('coworkBuildNumber') ?: '1').toString().trim().toInteger()

// Release signing (ENG-4023): the Play upload key, from the environment
// (build-android.yml) or the matching -P/gradle.properties names for a local
// build. Configured only when a keystore path is given, so an unsigned
// assembleDebug (mobile-smoke.yml) and local builds need none of it. Passwords
// are never read from the command line in CI: fastlane echoes the gradle
// command it runs.
def coworkSigning = { String envName, String propName ->
    def v = System.getenv(envName) ?: project.findProperty(propName)
    v == null ? null : v.toString()
}
def coworkKeystorePath = coworkSigning('ANDROID_KEYSTORE_PATH', 'coworkKeystorePath')

android {
    namespace = "ai.mindshub.cowork"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.mindshub.cowork"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode coworkVersionCode
        versionName coworkVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (coworkKeystorePath) {
            release {
                storeFile file(coworkKeystorePath)
                storePassword coworkSigning('ANDROID_KEYSTORE_PASSWORD', 'coworkKeystorePassword')
                keyAlias coworkSigning('ANDROID_KEY_ALIAS', 'coworkKeyAlias')
                keyPassword coworkSigning('ANDROID_KEY_PASSWORD', 'coworkKeyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (coworkKeystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
