# nginx server block for the cowork frontend-only image (Dockerfile.frontend).
#
# Serves ONLY the static SPA built by `npm run build:web` (dist/renderer-web/,
# shell index-web.html). It deliberately does NOT proxy /api: in web mode the
# SPA calls the cowork-server API same-origin at /api/v1/*, so the ingress in
# front of this image must route /api/v1 to the cowork-server Service.
#
# Listens on 8080 as the non-root nginx user (nginxinc/nginx-unprivileged).

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index-web.html;

    # Liveness/readiness probe target: cheap, no filesystem hit.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are content-addressed and immutable, so cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app shell must never be cached, so a new deploy is picked up
    # immediately on the next load.
    location = /index-web.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: serve the requested file if it exists, otherwise the shell.
    # Routing is client-side (state-driven, single URL), so this only matters
    # for direct hits / refreshes.
    location / {
        try_files $uri $uri/ /index-web.html;
    }
}
