# Static SPA only. Ingress must route /api/v1 to cowork-server; nginx listens unprivileged on 8080.

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index-web.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the shell: reloads must see new deploys.
    location = /index-web.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index-web.html;
    }
}
