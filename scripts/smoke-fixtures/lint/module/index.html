<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Module page</title>
</head>
<body>
<h1 id="status">Module page</h1>
<!-- A module that imports a file beside the page and fetches a JSON file
     beside it. Both work in Cowork's viewer; the lint must load both and
     report nothing. Either failure throws, which the lint reports. -->
<script type="module">
  import { greeting } from './greeting.js';
  const response = await fetch('./data.json');
  if (!response.ok) throw new Error(`lint smoke: data.json answered ${response.status}`);
  const data = await response.json();
  if (data.status !== 'loaded') throw new Error('lint smoke: data.json held the wrong status');
  document.getElementById('status').textContent = `${greeting}: ${data.status}`;
</script>
</body>
</html>
