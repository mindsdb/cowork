<title>Root-absolute page</title>

<body>
<h1>Root-absolute page</h1>
<!-- app.js sits beside this page, but /app.js names the root of the origin.
     Cowork's viewer serves the page below the server root, so the script is
     missing there, and the lint must report the request as failed. A lint
     that served the page's folder at the origin root would load app.js and
     pass the page. -->
<script src="/app.js"></script>
</body>
</html>
