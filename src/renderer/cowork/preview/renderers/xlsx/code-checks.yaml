# Text the xlsx preview must never hold. Each `pattern` is a JavaScript regular
# expression source, and `flags` its optional flags. A check may list examples:
# the test that runs the check asserts that the pattern matches each of
# `matches` and none of `skips`.
#
# source: matched against render.ts, by render.test.ts. The bundle checks
# live in ../../bundleChecks.yaml, run on the bundle that ships.

source:
  # The grid puts cells in through textContent only.
  - name: an innerHTML write
    pattern: '\binnerHTML\b'
  - name: an outerHTML write
    pattern: '\bouterHTML\b'
  - name: insertAdjacentHTML
    pattern: '\binsertAdjacentHTML\b'
  - name: document.write
    pattern: '\bdocument\.write'
  - name: SheetJS's HTML writer
    pattern: 'sheet_to_html'
  - name: a read of a cell's HTML (cell.h)
    pattern: '\.h\b'
  # Nothing in the grid is a link.
  - name: a read of a cell's hyperlink (cell.l)
    pattern: '\.l\b'
  - name: a bracket read of a cell's HTML or hyperlink (cell['h'], cell['l'])
    pattern: "\\[\\s*['\"`][hl]['\"`]\\s*\\]"
    matches:
      - cell['h']
      - cell["l"].Target
      - cell[ `l` ]
    skips:
      - sheet['!data']
      - row['hl']
  # Covers document.createElement('a') and the renderer's own element('a').
  - name: an anchor or area element
    pattern: "\\(\\s*['\"](?:a|area)['\"]"
  - name: an href
    pattern: '\bhref\b'
    flags: i
