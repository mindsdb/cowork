# Text the slide preview's code must never hold, and packages the repository
# must never depend on. Each `pattern` is a JavaScript regular expression
# source, and `flags` its optional flags.
#
# bundle: matched against the whole built IIFE, minified and not.
# source: matched against each renderer file other than tests.
# packages: matched against every package name in package.json and
#           package-lock.json.

bundle:
  # Nothing in the frame may reach the network, start a thread or run strings as code.
  - name: a fetch call
    pattern: '\bfetch\b'
  - name: XMLHttpRequest
    pattern: '\bXMLHttpRequest\b'
  - name: a Worker
    pattern: 'Worker\b'
  - name: an eval call
    pattern: '\beval\s*\('
  - name: the Function constructor
    pattern: '\bFunction\s*\('
  # The bundle generator's own bans: the frame runs one inline script by hash.
  - name: a dynamic import
    pattern: '\bimport\s*\('
  - name: import.meta
    pattern: '\bimport\.meta\b'
  - name: an opening script tag
    pattern: '<script'
    flags: i
  - name: a closing script tag
    pattern: '</script'
    flags: i
  - name: a NUL character
    pattern: '\x00'
  - name: a process reference
    pattern: '\bprocess\.'
  # Slide text goes in through textContent only.
  - name: an innerHTML write
    pattern: '\binnerHTML\b'
  - name: an outerHTML write
    pattern: '\bouterHTML\b'
  - name: insertAdjacentHTML
    pattern: '\binsertAdjacentHTML\b'

source:
  # Slide text goes in through textContent only.
  - name: innerHTML
    pattern: '\binnerHTML\b'
  - name: outerHTML
    pattern: '\bouterHTML\b'
  - name: insertAdjacentHTML
    pattern: '\binsertAdjacentHTML\b'
  - name: document.write
    pattern: '\bdocument\.write'
  - name: createContextualFragment
    pattern: '\bcreateContextualFragment\b'
  - name: a style written as one string
    pattern: '\bcssText\b|setAttribute\(\s*[''"]style'
  # Nothing in a slide is a link, and no picture is followed through r:link.
  - name: an anchor element
    pattern: "createElement\\(\\s*['\"]a['\"]"
  - name: an href
    pattern: '\bhref\b'
    flags: i
  - name: a read of an r:link attribute
    pattern: "['\"]link['\"]"
  # Nothing in the frame may reach the network or start a thread.
  - name: a fetch call
    pattern: '\bfetch\b'
  - name: XMLHttpRequest
    pattern: '\bXMLHttpRequest\b'
  - name: a Worker
    pattern: 'Worker\b'
  # The archive comes only from ctx.openZip, after the runtime's guard.
  - name: an import of JSZip
    pattern: "from\\s+['\"]jszip['\"]"

packages:
  # The slide preview is Cowork's own code on DOMParser and the runtime's
  # archive, so no package that reads or draws PowerPoint files is installed.
  - name: a PowerPoint package
    pattern: 'ppt|powerpoint'
    flags: i
