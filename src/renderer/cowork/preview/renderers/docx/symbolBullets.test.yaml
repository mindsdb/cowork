# Cases for symbolBullets.test.ts. Each case is one numbering level as
# docx-preview parses it: its w:numFmt as `format`, its w:lvlText as
# `levelText`, the CSS font-family its w:rFonts gives as `font` (absent for
# none), and `picture: true` for a picture bullet. After the step, the level's
# text must be `text`, and its font `keepsFont: true` (as it was) or gone.

rewritten:
  - name: Word's first level, Symbol U+F0B7, becomes a bullet
    format: bullet
    levelText: ""
    font: Symbol
    text: "•"
  - name: the same character below U+0100, Symbol U+00B7, becomes a bullet
    format: bullet
    levelText: "·"
    font: Symbol
    text: "•"
  - name: Word's third level, Wingdings U+F0A7, becomes a small square
    format: bullet
    levelText: ""
    font: Wingdings
    text: "▪"
  - name: Wingdings U+00A7 becomes the same small square
    format: bullet
    levelText: "§"
    font: Wingdings
    text: "▪"
  - name: Symbol U+F0A7 is a club in Symbol, not Wingdings' square
    format: bullet
    levelText: ""
    font: Symbol
    text: "♣"
  - name: Wingdings' arrow, diamond, check, square and box bullets
    format: bullet
    levelText: ""
    font: Wingdings
    text: "➢❖✓■❑"
  - name: a Wingdings 2 character the table doesn't name becomes a plain bullet
    format: bullet
    levelText: ""
    font: "'Wingdings 2'"
    text: "•"
  - name: a Webdings character becomes a plain bullet
    format: bullet
    levelText: ""
    font: Webdings
    text: "•"
  - name: Symbol named first in a list of families still counts
    format: bullet
    levelText: ""
    font: "Symbol, 'Segoe UI'"
    text: "•"
  - name: white space and a %1 placeholder stay as they are
    format: bullet
    levelText: " %1"
    font: Symbol
    text: "• %1"

unchanged:
  - name: Word's second level, a Courier New o, keeps its character and font
    format: bullet
    levelText: o
    font: "'Courier New'"
    text: o
    keepsFont: true
  - name: an OpenSymbol bullet is already Unicode
    format: bullet
    levelText: "•"
    font: OpenSymbol
    text: "•"
    keepsFont: true
  - name: a Segoe UI Symbol bullet is already Unicode
    format: bullet
    levelText: "◦"
    font: "'Segoe UI Symbol'"
    text: "◦"
    keepsFont: true
  - name: a numbered level in a Symbol font keeps its number
    format: decimal
    levelText: "%1."
    font: Symbol
    text: "%1."
    keepsFont: true
  - name: a picture bullet keeps its level text and font
    format: bullet
    levelText: ""
    font: Symbol
    picture: true
    text: ""
    keepsFont: true
  - name: a bullet with no font keeps its character
    format: bullet
    levelText: "•"
    text: "•"
    keepsFont: true
  - name: a Symbol level of only white space keeps its font
    format: bullet
    levelText: " "
    font: Symbol
    text: " "
    keepsFont: true
