# The artifact, its saved source and the text ArtifactViewer.unsavedEdit.test.jsx
# types into the editor.
savedText: Saved line
typedText: ' and an unsaved edit'
artifact:
  id: aaaaaaaaaaaa4aaa8aaaaaaaaaaaaaaa
  title: Notes
  type: document
  ext: .md
  path: /artifacts/notes/notes.md
  canonicalPath: /artifacts/notes/notes.md
