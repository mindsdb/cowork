<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Web CSP: no file:// or app:// origins (those are Electron-only).
         connect-src is broadened to https/wss for hosted deployments where
         the SPA and FastAPI may share an https origin behind a proxy.
         frame-src/child-src allow loopback at any port so the artifact
         preview iframe (served by `anton_api.preview_proxy` on a free
         port) loads — without these, Chrome blocks the iframe with
         "Refused to frame ... violates Content Security Policy
         directive: frame-src 'self'".
         The apis.google.com / docs.google.com / gstatic entries are the
         Google Drive Picker, which the web build renders as an in-page
         overlay (see host.ts's pickDriveFiles): its SDK is a script from
         apis.google.com, its file browser is an iframe from
         docs.google.com, and the file-type icons it draws come from
         gstatic/googleusercontent. Web only — Electron's picker runs in
         the OS browser instead, so index.html needs none of them.
         Tighten per-deployment via reverse-proxy headers if needed.

         cdn.jsdelivr.net is TEMPORARY and is not for this app's own code — it
         is for artifact previews (ENG-2818). On web an artifact is rendered
         into the preview iframe via `srcdoc`, and a srcdoc document inherits
         this policy, so the chart library anton's own skill mandates
         (build-html-dashboard/SKILL.md: "ALWAYS use Apache ECharts… via CDN"
         from exactly this host) is blocked and every chart renders blank while
         the rest of the page looks fine.

         One host, not an allowlist to grow: that skill requires CSS, JS and
         data inlined, and images as data: URIs or sibling files, so this is
         the single deliberate remote reference. Desktop does not need it —
         ENG-2818 made Desktop navigate the iframe, so artifacts there no
         longer inherit anything, which is why index.html is untouched.

         Remove this when ENG-2822 gives web the same treatment. Until then a
         web artifact still inherits the rest of this policy, so remote images
         and web fonts stay blocked — this fixes charts, not the class. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.googleusercontent.com https://ssl.gstatic.com https://www.gstatic.com; connect-src 'self' ws: wss: http: https:; frame-src 'self' http://127.0.0.1:* http://localhost:* https://docs.google.com https://drive.google.com; child-src 'self' http://127.0.0.1:* http://localhost:* https://docs.google.com https://drive.google.com" />
    <title>MindsHub Cowork</title>
    <!-- Brand favicon: the same MindsHub "minds" mark as the desktop app icon,
         so the web tab matches the dock/taskbar glyph. SVG for crisp tabs on
         all modern browsers; the 180×180 PNG (downscaled from the desktop
         icon.png) covers iOS/Safari home-screen apple-touch-icon.
         Root-absolute (not `./`): the web SPA is served over http with a `/`
         base and has deep client-side routes (`/c/:id`), where a relative path
         resolves against the route and 404s. These assets live in public/. -->
    <link rel="icon" type="image/svg+xml" href="/minds-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/gravity-field/gravity-field.css" />
    <!-- Boot veil: solid-black first paint that fades out so the window
         never flashes the half-initialized canvas / pre-skin theme. -->
    <style>
      #boot-veil {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 2147483647;
        pointer-events: none;
        animation: boot-veil-fade 600ms ease-out 320ms both;
      }
      @keyframes boot-veil-fade {
        0%   { opacity: 1; }
        100% { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-veil { animation-delay: 0ms; animation-duration: 1ms; }
      }
    </style>
  </head>
  <body class="gf-theme-dark">
    <div id="boot-veil"></div>
    <canvas id="gravity-field-bg" class="gravity-field" aria-hidden="true"></canvas>
    <div id="root"></div>
    <script src="/gravity-field/gravity-field.js"></script>
    <script>
      window.gravityField = window.GravityField.mount(
        document.getElementById('gravity-field-bg'),
        { theme: 'dark', trackPointer: false },
      );
    </script>
    <script type="module" src="/web-main.tsx"></script>
  </body>
</html>
