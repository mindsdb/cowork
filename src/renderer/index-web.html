<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Web CSP: no file:// or app:// origins (those are Electron-only).
         connect-src is broadened to https/wss for hosted deployments where
         the SPA and FastAPI may share an https origin behind a proxy.
         frame-src/child-src allow loopback at any port so the artifact
         preview iframe (served by `anton_api.preview_proxy` on a free
         port) loads — without these, Chrome blocks the iframe with
         "Refused to frame ... violates Content Security Policy
         directive: frame-src 'self'".
         Tighten per-deployment via reverse-proxy headers if needed. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws: wss: http: https:; frame-src 'self' http://127.0.0.1:* http://localhost:*; child-src 'self' http://127.0.0.1:* http://localhost:*" />
    <title>MindsHub Cowork</title>
    <!-- Brand favicon: the same MindsHub "minds" mark as the desktop app icon,
         so the web tab matches the dock/taskbar glyph. SVG for crisp tabs on
         all modern browsers; the 180×180 PNG (downscaled from the desktop
         icon.png) covers iOS/Safari home-screen apple-touch-icon. -->
    <link rel="icon" type="image/svg+xml" href="./minds-icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./gravity-field/gravity-field.css" />
    <!-- Boot veil: solid-black first paint that fades out so the window
         never flashes the half-initialized canvas / pre-skin theme. -->
    <style>
      #boot-veil {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 2147483647;
        pointer-events: none;
        animation: boot-veil-fade 600ms ease-out 320ms both;
      }
      @keyframes boot-veil-fade {
        0%   { opacity: 1; }
        100% { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-veil { animation-delay: 0ms; animation-duration: 1ms; }
      }
    </style>
  </head>
  <body class="gf-theme-dark">
    <div id="boot-veil"></div>
    <canvas id="gravity-field-bg" class="gravity-field" aria-hidden="true"></canvas>
    <div id="root"></div>
    <script src="./gravity-field/gravity-field.js"></script>
    <script>
      window.gravityField = window.GravityField.mount(
        document.getElementById('gravity-field-bg'),
        { theme: 'dark', trackPointer: false },
      );
    </script>
    <script type="module" src="./web-main.tsx"></script>
  </body>
</html>
