<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Allow hosted https/wss connections, loopback preview frames, and the in-page Google Picker SDK/frame/assets.
Electron-only file/app origins are omitted; deployment proxy headers may tighten this policy. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.googleusercontent.com https://ssl.gstatic.com https://www.gstatic.com; connect-src 'self' ws: wss: http: https:; frame-src 'self' http://127.0.0.1:* http://localhost:* https://docs.google.com https://drive.google.com; child-src 'self' http://127.0.0.1:* http://localhost:* https://docs.google.com https://drive.google.com" />
    <title>MindsHub Cowork</title>
    <!-- Use root-absolute favicon paths so deep SPA routes resolve the same assets. -->
    <link rel="icon" type="image/svg+xml" href="/minds-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/gravity-field/gravity-field.css" />
    <!-- Cover the first paint until the theme and canvas initialize. -->
    <style>
      #boot-veil {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 2147483647;
        pointer-events: none;
        animation: boot-veil-fade 600ms ease-out 320ms both;
      }
      @keyframes boot-veil-fade {
        0%   { opacity: 1; }
        100% { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-veil { animation-delay: 0ms; animation-duration: 1ms; }
      }
    </style>
  </head>
  <body class="gf-theme-dark">
    <div id="boot-veil"></div>
    <canvas id="gravity-field-bg" class="gravity-field" aria-hidden="true"></canvas>
    <div id="root"></div>
    <script src="/gravity-field/gravity-field.js"></script>
    <script>
      window.gravityField = window.GravityField.mount(
        document.getElementById('gravity-field-bg'),
        { theme: 'dark', trackPointer: false },
      );
    </script>
    <script type="module" src="/web-main.tsx"></script>
  </body>
</html>
