<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws://localhost:* http://127.0.0.1:* http://localhost:* https://us.i.posthog.com https://mindsdb.github.io; frame-src http://127.0.0.1:* http://localhost:*; child-src http://127.0.0.1:* http://localhost:*" />
    <title>MindsHub Cowork</title>
    <link rel="stylesheet" href="./gravity-field/gravity-field.css" />
    <!-- Keep the boot veil opaque until main adds boot-veil--fade after ready-to-show, covering the first visible frame. -->
    <style>
      #boot-veil {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 2147483647;
        pointer-events: none;
        opacity: 1;
        transition: opacity 260ms ease-out, visibility 0s linear 260ms;
      }
      #boot-veil.boot-veil--fade { opacity: 0; visibility: hidden; }
      @media (prefers-reduced-motion: reduce) {
        #boot-veil { transition-duration: 1ms; }
      }
    </style>
  </head>
  <!-- React applies the persisted theme; default dark prevents a white first paint. -->
  <body class="gf-theme-dark">
    <div id="boot-veil"></div>
    <canvas id="gravity-field-bg" class="gravity-field" aria-hidden="true"></canvas>
    <div id="root"></div>
    <script src="./gravity-field/gravity-field.js"></script>
    <script>
      // Mount once; React calls window.gravityField.setTheme(...) when
      // the theme preference changes. pointerTarget=document.body so the
      // canvas (which has pointer-events:none) still sees cursor coords.
      // trackPointer:false → field drifts freely on its own; cursor
      // doesn't steer the attractor. The default would steer toward the
      // mouse, which felt distracting once the dots cover the whole window.
      window.gravityField = window.GravityField.mount(
        document.getElementById('gravity-field-bg'),
        { theme: 'dark', trackPointer: false },
      );
    </script>
    <script type="module" src="./main.tsx"></script>
    <script>
      // Fade the boot veil once the window is actually visible.
      //   • First open: the window is created hidden (show:false), so the doc
      //     starts 'hidden' — wait for it to become visible, then fade. (The
      //     main process also nudges this on ready-to-show; both are idempotent.)
      //   • Refresh: ready-to-show does NOT fire again, but the window is
      //     already visible, so fade right away — no long black screen.
      (function () {
        function fade() {
          var v = document.getElementById('boot-veil');
          if (v) v.classList.add('boot-veil--fade');
        }
        if (document.visibilityState === 'visible') {
          setTimeout(fade, 140);
        } else {
          document.addEventListener('visibilitychange', function onVis() {
            if (document.visibilityState === 'visible') {
              document.removeEventListener('visibilitychange', onVis);
              setTimeout(fade, 140);
            }
          });
          setTimeout(fade, 3000); // safety net if visibility never flips
        }
      })();
    </script>
  </body>
</html>
