# Requests src/main/server-token-listener.test.ts sends through the server
# token listener with no gate holding them, and which of the server's headers
# each must go out with. The test runs the listener with the real document
# preview guard, the server on port 26866, a fixed token and window proof, and
# a main window whose contents id is 7 and whose top-level frame is `main`.
#
#   frame          main: the main window's top-level frame. subframe: a frame
#                  inside it with no name, such as the HTML viewer's. preview:
#                  the frame created with the preview name. unreadable: a frame
#                  whose every property throws, as a destroyed one does. none:
#                  a request with no frame.
#   resourceType   Electron's resource type. Left out, xhr (a fetch).
#   webContents    main: the request names the main window's contents. other:
#                  another WebContents. none: no webContentsId. Left out, main.
#   window         open: the main window is there. gone: it is destroyed.
#                  unreadable: reading its top-level frame throws. Left out, open.
#   bringsProof    the header name under which the request already carries a
#                  forged window proof. Left out, it carries none.
#   viteDevPort    Vite's port when the renderer is served from Vite. Left out,
#                  the renderer is not served from Vite.
#   serverToken    false when no server was launched, so there is no token and
#                  no proof. Left out, a server was launched.
#   authorized     whether the request goes out with the token.
#   proved         whether it goes out with the real window proof.
#   keepsForged    whether the forged proof it brought goes out untouched. Left
#                  out, false.
requests:
  - name: a main-window fetch to the server
    url: http://127.0.0.1:26866/api/v1/conversations
    frame: main
    authorized: true
    proved: true
  - name: a preview-frame call to the server
    url: http://127.0.0.1:26866/api/v1/conversations
    frame: preview
    authorized: false
    proved: false
  - name: a server call with no frame
    url: http://127.0.0.1:26866/api/v1/conversations
    frame: none
    authorized: false
    proved: false
  - name: a server call from a frame that can no longer be read
    url: http://127.0.0.1:26866/api/v1/conversations
    frame: unreadable
    authorized: false
    proved: false
  - name: a main-window /api/ fetch through Vite
    url: http://localhost:5173/api/v1/conversations
    frame: main
    viteDevPort: "5173"
    authorized: true
    proved: true
  - name: a preview-frame /api/ call through Vite
    url: http://localhost:5173/api/v1/conversations
    frame: preview
    viteDevPort: "5173"
    authorized: false
    proved: false
  - name: a Vite module request outside /api/
    url: http://localhost:5173/src/main.tsx
    frame: main
    resourceType: script
    viteDevPort: "5173"
    authorized: false
    proved: false
  - name: an /api/ call to Vite's port when the renderer is not served from Vite
    url: http://localhost:5173/api/v1/conversations
    frame: main
    authorized: false
    proved: false
  - name: a main-window call to another loopback port
    url: http://127.0.0.1:9999/api/v1/conversations
    frame: main
    authorized: false
    proved: false
  - name: a main-window call when no server was launched
    url: http://127.0.0.1:26866/api/v1/conversations
    frame: main
    serverToken: false
    authorized: false
    proved: false
  - name: a main-window image from the server
    url: http://127.0.0.1:26866/api/v1/files/raw/picture.png
    frame: main
    resourceType: image
    authorized: true
    proved: false
  - name: a main-window navigation to the server
    url: http://127.0.0.1:26866/api/v1/files/raw/report.html
    frame: main
    resourceType: mainFrame
    authorized: true
    proved: false
  - name: a main-window beacon to the server
    url: http://127.0.0.1:26866/api/v1/conversations
    frame: main
    resourceType: ping
    authorized: true
    proved: false
  - name: a fetch from a frame inside the main window
    url: http://127.0.0.1:26866/api/v1/conversations
    frame: subframe
    authorized: true
    proved: false
  - name: a top-level fetch that names another WebContents
    url: http://127.0.0.1:26866/api/v1/conversations
    frame: main
    webContents: other
    authorized: true
    proved: false
  - name: a top-level fetch with no webContentsId
    url: http://127.0.0.1:26866/api/v1/conversations
    frame: main
    webContents: none
    authorized: true
    proved: false
  - name: a top-level fetch after the main window is gone
    url: http://127.0.0.1:26866/api/v1/conversations
    frame: main
    window: gone
    authorized: true
    proved: false
  - name: a top-level fetch when the main window can no longer be read
    url: http://127.0.0.1:26866/api/v1/conversations
    frame: main
    window: unreadable
    authorized: true
    proved: false
  - name: a main-window fetch that brings a forged proof
    url: http://127.0.0.1:26866/api/v1/settings/raw
    frame: main
    bringsProof: X-Cowork-Window-Proof
    authorized: true
    proved: true
  - name: a subframe fetch that brings a forged proof
    url: http://127.0.0.1:26866/api/v1/settings/raw
    frame: subframe
    bringsProof: X-Cowork-Window-Proof
    authorized: true
    proved: false
  - name: a subframe fetch that brings a forged proof in lower case
    url: http://127.0.0.1:26866/api/v1/settings/raw
    frame: subframe
    bringsProof: x-cowork-window-proof
    authorized: true
    proved: false
  - name: a preview-frame fetch that brings a forged proof
    url: http://127.0.0.1:26866/api/v1/settings/raw
    frame: preview
    bringsProof: X-Cowork-Window-Proof
    authorized: false
    proved: false
  - name: a preview-frame /api/ fetch through Vite that brings a forged proof
    url: http://localhost:5173/api/v1/settings/raw
    frame: preview
    viteDevPort: "5173"
    bringsProof: X-Cowork-Window-Proof
    authorized: false
    proved: false
  - name: a fetch with a forged proof when no server was launched
    url: http://127.0.0.1:26866/api/v1/settings/raw
    frame: main
    serverToken: false
    bringsProof: X-Cowork-Window-Proof
    authorized: false
    proved: false
  - name: a forged proof sent to another loopback port, which is not the server
    url: http://127.0.0.1:9999/api/v1/settings/raw
    frame: subframe
    bringsProof: X-Cowork-Window-Proof
    authorized: false
    proved: false
    keepsForged: true
