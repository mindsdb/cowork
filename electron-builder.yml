appId: com.mindshub.cowork
productName: MindsHub Cowork
copyright: Copyright © 2024
electronUpdaterCompatibility: ">=2.16"

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - "!dist/**/*.map"
  - node_modules/**/*
  - "!node_modules/*/{CHANGELOG.md,README.md,readme.md}"
  # appdmg is a build-time DMG tool. Its native transitive deps (fs-xattr,
  # macos-alias) don't rebuild per-arch, so the same arm64 .node lands in both
  # halves of the universal app and breaks @electron/universal's merge. npm
  # hoists them to top level, so each is excluded by name (not via appdmg/**).
  # None belong in the shipped app.
  - "!node_modules/appdmg/**"
  - "!node_modules/fs-xattr/**"
  - "!node_modules/macos-alias/**"

# Only the files the app loads or runs by path sit outside app.asar, in
# app.asar.unpacked, which asar integrity does not cover. Everything else, the
# native modules' JavaScript included, stays in app.asar. Smart unpack is off,
# because it moves the whole folder of any module that holds one native file.
# The patterns name, file by file, what smart unpack looks for:
# - native modules (keytar.node, and node-pty's pty.node, conpty.node and
#   conpty_console_list.node), which Node loads with dlopen, and the libraries
#   and executables beside them (node-pty's conpty.dll and OpenConsole.exe);
# - node-pty's spawn-helper, an executable without an extension, which
#   node-pty runs from its own folder's path with app.asar replaced by
#   app.asar.unpacked.
# Pinned by src/main/release-hardening.invariant.test.ts.
asar:
  smartUnpack: false
asarUnpack:
  - "**/*.{node,dll,exe,dylib,so}"
  - "**/node_modules/node-pty/**/spawn-helper"

mac:
  # .icns, not the PNG: see scripts/generate-mac-icons.sh.
  icon: icon.icns
  artifactName: "mindshub-cowork-update-${version}.${ext}"
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  # node-pty (the Claude Code terminal) builds arm64-only from source with no
  # x64 prebuild, so its .node is identical in both universal halves and
  # app-builder-lib 26.15.3 refuses to merge it without this acknowledgement.
  # keytar and the rest ship real per-arch prebuilds, so they merge normally
  # and stay correct on Intel. The terminal is arm64-only on Intel until
  # node-pty gets a real x64 build.
  x64ArchFiles: "**/node-pty/**"
  # The hardened runtime is what makes macOS ignore DYLD_ variables and refuse
  # libraries another team signed; the entitlements below grant neither
  # exemption. The app and its helpers sign with the same file. Leaving either
  # key unset would sign with app-builder-lib's template instead, which grants
  # disable-library-validation.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Electron 44+ does not run on macOS 12. Written as LSMinimumSystemVersion;
  # kept in step with the .pkg and the update feed by
  # src/main/macos-minimum.invariant.test.ts.
  minimumSystemVersion: "13.0"
  extendInfo:
    NSMicrophoneUsageDescription: MindsHub Cowork uses the microphone for voice dictation in the chat composer.

dmg:
  format: UDZO
  background: dmg-background.png
  iconSize: 120
  iconTextSize: 14
  window:
    width: 1200
    height: 800
  contents:
    - x: 300
      y: 520
      type: file
    - x: 900
      y: 520
      type: link
      path: /Applications

win:
  icon: icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-Setup-${version}.${ext}"
  # ENG-1241: Windows-only override, combined additively with the root-level
  # extraResources below. macOS deliberately gets none — its credentials are
  # staged outside the signed bundle by a pkgbuild postinstall script instead
  # (see build/pkg-scripts/), since Contents/Resources there is root-owned
  # and the app could never delete anything placed inside it. Windows's
  # per-user install location doesn't have that problem, so the file simply
  # stays where it's always been; credential-provisioning.ts reads and
  # deletes it from there directly.
  extraResources:
    - from: server-credentials.json
      to: server-credentials.json

nsis:
  oneClick: false
  # ENG-1367: keep this off. When it's on, a manual (non-auto-update) upgrade
  # run tells the previous version's uninstaller to delete its Start-Menu
  # shortcut and unregister the AppUserModelID, which destroys the user's
  # taskbar pin on every update. With it off the installer passes
  # --keep-shortcuts instead, and the pin survives. Upgrades still land in the
  # previously recorded install directory either way; only the fresh-install
  # directory chooser is lost (the /D installer switch remains for that).
  allowToChangeInstallationDirectory: false
  perMachine: false

linux:
  icon: icon.png
  category: Development
  maintainer: MindsDB <hello@mindsdb.com>
  # Avoid the legacy package.json name ("anton") leaking into the package
  # name, /opt path, and binary.
  executableName: mindshub-cowork
  # No arch list: build for the host arch only. Native modules (keytar)
  # can't be cross-compiled, so CI builds each arch on its own runner.
  target:
    - target: deb
  # ENG-1241: carrier only — /opt is root-owned, so deb.afterInstall stages a
  # private copy into the installing user's home and deletes this one. Keep it
  # linux-scoped: the root-level list is additive and would reach macOS.
  extraResources:
    - from: server-credentials.json
      to: server-credentials.json

deb:
  packageName: mindshub-cowork
  # ${productFilename} resolves to linux.executableName, so the file name
  # follows the per-channel package name instead of always claiming to be prod.
  artifactName: "${productFilename}_${version}_${arch}.${ext}"
  # Stages the credentials out of root-owned /opt into the installing user's
  # home; without it they persist world-readable and the app can never clean up.
  afterInstall: build/deb-scripts/postinst.sh
  # Removes the staged credentials an install that was never launched left in
  # the user's home. Carries upstream's after-remove.tpl for the same reason.
  afterRemove: build/deb-scripts/postrm.sh
  # Overriding depends replaces electron-builder's defaults, so the default
  # runtime libs are repeated here. curl bootstraps uv on first run; git is for
  # coding mode's per-task worktrees, NOT the server install (every packaged
  # kind resolves the pypi channel). lsof backs killProcessOnPort()'s orphan
  # reaping (server-process.ts) — none are guaranteed on a minimal Debian.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - lsof
    - git
    - curl

extraResources:
  - from: scripts/install_release_server.py
    to: install_release_server.py
  # Generated by run-electron-builder.mjs for eligible prod/stable packages.
  # Embedding it before signing keeps the feed config inside the signed app;
  # unsupported builds omit the generated source and remain updater-disabled.
  - from: build/app-update.yml
    to: app-update.yml
  - from: assets/
    to: assets/
    filter:
      - "**/*"
  - from: build-config.json
    to: build-config.json

afterPack: scripts/after-pack.js
afterSign: scripts/notarize.js

# Electron fuses, written into the packaged Electron binary after afterPack and
# before signing, so the signature covers them (both slices of a universal
# macOS app). Each closes a way to run code as this signed app without
# changing it. Fuses not named here keep Electron's defaults. Pinned by
# src/main/release-hardening.invariant.test.ts.
electronFuses:
  # Ignore ELECTRON_RUN_AS_NODE, which turns the app into a plain Node runtime.
  runAsNode: false
  # Ignore NODE_OPTIONS (such as --require) and NODE_EXTRA_CA_CERTS. Electron
  # also removes both from the environment its child processes inherit.
  enableNodeOptionsEnvironmentVariable: false
  # Ignore --inspect and its variants, and SIGUSR1, so no debugger attaches to
  # the main process.
  enableNodeCliInspectArguments: false
  # grantFileProtocolExtraPrivileges stays at Electron's default (on). With it
  # off, Electron no longer reads app.asar over file://, and the main window
  # loads its renderer from file://.../app.asar, so the app opens blank. It can
  # go off once the renderer loads through a custom scheme.
  # Refuse an app.asar whose header no longer matches the hash written at
  # pack time: ElectronAsarIntegrity in Info.plist on macOS, the INTEGRITY
  # resource in the .exe on Windows. Linux has no such check.
  enableEmbeddedAsarIntegrityValidation: true
  # Load the app only from app.asar, never from a resources/app folder.
  onlyLoadAppFromAsar: true
  # Writing the fuses breaks the ad-hoc signature Electron Framework ships
  # with, and Apple Silicon refuses to run arm64 code with a broken signature.
  # A signed build replaces this signature when electron-builder signs, and
  # every macOS package CI builds is signed, a pull request's included. An
  # unsigned build (npm run pack without an identity, such as the nightly pack
  # smoke, or MAC_PKG_UNSIGNED) launches only because of it. Ignored off macOS.
  resetAdHocDarwinSignature: true
