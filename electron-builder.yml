appId: com.mindshub.cowork
productName: MindsHub Cowork
copyright: Copyright © 2024

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - node_modules/**/*
  - "!node_modules/*/{CHANGELOG.md,README.md,readme.md}"

mac:
  icon: icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: MindsHub Cowork uses the microphone for voice dictation in the chat composer.

dmg:
  format: UDZO
  background: dmg-background.png
  iconSize: 120
  iconTextSize: 14
  window:
    width: 1200
    height: 800
  contents:
    - x: 300
      y: 520
      type: file
    - x: 900
      y: 520
      type: link
      path: /Applications

win:
  icon: icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  icon: icon.png
  category: Development
  maintainer: MindsDB <hello@mindsdb.com>
  # Avoid the legacy package.json name ("anton") leaking into the package
  # name, /opt path, and binary.
  executableName: mindshub-cowork
  target:
    - target: deb
      arch: [x64, arm64]

deb:
  packageName: mindshub-cowork
  artifactName: "mindshub-cowork_${version}_${arch}.${ext}"
  # Overriding depends replaces electron-builder's defaults, so the default
  # runtime libs are repeated here. git and curl are required by the
  # first-run cowork-server installer (uv bootstrap + git-based install).
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - git
    - curl

extraResources:
  - from: assets/
    to: assets/
    filter:
      - "**/*"
  - from: server-credentials.json
    to: server-credentials.json

afterPack: scripts/strip-xattrs.js
afterSign: scripts/notarize.js
