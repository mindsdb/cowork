appId: com.mindshub.cowork
productName: MindsHub Cowork
copyright: Copyright © 2024
electronUpdaterCompatibility: ">=2.16"

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - "!dist/**/*.map"
  - node_modules/**/*
  - "!node_modules/*/{CHANGELOG.md,README.md,readme.md}"
  # Exclude appdmg and hoisted native dependencies: their identical per-arch binaries break universal merging.
  - "!node_modules/appdmg/**"
  - "!node_modules/fs-xattr/**"
  - "!node_modules/macos-alias/**"

mac:
  icon: icon.png
  artifactName: "mindshub-cowork-update-${version}.${ext}"
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  # node-pty currently lacks a real x64 build; acknowledge identical arm64 binaries in universal packaging.
  # Other native modules retain real per-architecture builds.
  x64ArchFiles: "**/node-pty/**"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: MindsHub Cowork uses the microphone for voice dictation in the chat composer.

dmg:
  format: UDZO
  background: dmg-background.png
  iconSize: 120
  iconTextSize: 14
  window:
    width: 1200
    height: 800
  contents:
    - x: 300
      y: 520
      type: file
    - x: 900
      y: 520
      type: link
      path: /Applications

win:
  icon: icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-Setup-${version}.${ext}"
  # Windows can delete provisioned credentials from its per-user install. macOS must stage outside
  # the root-owned signed bundle through pkg postinstall; keep this resource Windows-only.
  extraResources:
    - from: server-credentials.json
      to: server-credentials.json

nsis:
  oneClick: false
  # Keep directory changes disabled on upgrade: otherwise the old uninstaller removes shortcuts/AppUserModelID
  # and destroys taskbar pins. Fresh installs can still specify /D.
  allowToChangeInstallationDirectory: false
  perMachine: false

linux:
  icon: icon.png
  category: Development
  maintainer: MindsDB <hello@mindsdb.com>
  executableName: mindshub-cowork
  # Native modules require one build per native architecture.
  target:
    - target: deb
  # Linux credentials are a carrier for postinst staging; keep them platform-scoped so they cannot reach macOS.
  extraResources:
    - from: server-credentials.json
      to: server-credentials.json

deb:
  packageName: mindshub-cowork
  # productFilename resolves to executableName, preserving channel-specific filenames.
  artifactName: "${productFilename}_${version}_${arch}.${ext}"
  # Stage credentials in the user's home so provisioning can delete them.
  afterInstall: build/deb-scripts/postinst.sh
  # Clean staged credentials left by an install that never launched; preserve upstream removal steps.
  afterRemove: build/deb-scripts/postrm.sh
  # depends replaces defaults. Keep runtime libraries plus curl for uv, git for coding worktrees,
  # and lsof for orphan-port cleanup; minimal Debian may provide none of them.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - lsof
    - git
    - curl

extraResources:
  # Embed eligible-channel feed metadata before signing; missing generated metadata keeps updates disabled.
  - from: build/app-update.yml
    to: app-update.yml
  - from: assets/
    to: assets/
    filter:
      - "**/*"
  - from: build-config.json
    to: build-config.json

afterPack: scripts/after-pack.js
afterSign: scripts/notarize.js
