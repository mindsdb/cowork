deployment:
  name: cowork-frontend

  replicaCount: 2

  image:
    # Match the build-push-ecr repo slug and tags.cowork deployment key.
    repository: 168681354662.dkr.ecr.us-east-1.amazonaws.com/mindsdb-cowork
    # Use the image's nginx entrypoint; static SPA service URLs are baked or derived from origin.

  # Ingress targets Service port 80; nginx listens on container port 8080.
  service:
    targetPort: 8080

  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    path: /healthz

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 4
    failureThreshold: 3
    path: /healthz

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 128Mi

  autoscaling:
    enabled: false

  # Serve static assets publicly; authentication happens in the SPA/cloud gate and API ingress.
  ingress:
    enabled: true
    name: cowork-frontend
