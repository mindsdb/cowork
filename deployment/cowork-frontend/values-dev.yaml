deployment:
  extraEnvs:
    - name: ACCESS_LOG_MODE
      value: "errors"
  ingress:
    enabled: true
    name: cowork-frontend
    pathType: Prefix
    hosts:
      - host: cowork.dev.mindshub.ai
        enableMultiPath: true
        paths:
          - path: /
            serviceName: cowork-frontend
            servicePort: 80
