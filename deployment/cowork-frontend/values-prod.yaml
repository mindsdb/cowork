deployment:
  image:
    # The prod tier. Only a main build writes this repository, so prod never
    # runs a pull request or staging image.
    repository: 168681354662.dkr.ecr.us-east-1.amazonaws.com/mindsdb-cowork
  ingress:
    enabled: true
    name: cowork-frontend
    pathType: Prefix
    hosts:
      - host: cowork.mindshub.ai
        enableMultiPath: true
        paths:
          - path: /
            serviceName: cowork-frontend
            servicePort: 80
